<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Open Graph metadata audit workflow</title><desc id="desc">An original graphic compares a page's title, description, image and canonical URL with a social link preview card and validation checklist.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a32"/><stop offset="1" stop-color="#2c3d60"/></linearGradient><linearGradient id="art" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5d9cf6"/><stop offset="1" stop-color="#64ddc4"/></linearGradient></defs>
<rect width="1600" height="900" rx="42" fill="url(#bg)"/><text x="100" y="120" fill="#83e4d1" font-family="Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="5">TOOLBOXKART • SOCIAL METADATA</text><text x="100" y="205" fill="#fff" font-family="Arial,sans-serif" font-size="58" font-weight="700">Open Graph Audit</text><text x="100" y="266" fill="#d6e4fa" font-family="Arial,sans-serif" font-size="30">Validate the tags and the preview they produce</text>
<g transform="translate(100 340)"><rect width="610" height="405" rx="28" fill="#172744" stroke="#58759c" stroke-width="3"/><text x="45" y="60" fill="#fff" font-family="Arial,sans-serif" font-size="31" font-weight="700">HTML metadata</text><g fill="#8fb6f7" font-family="monospace" font-size="22"><text x="45" y="115">&lt;meta property="og:title"&gt;</text><text x="45" y="165">&lt;meta property="og:type"&gt;</text><text x="45" y="215">&lt;meta property="og:url"&gt;</text><text x="45" y="265">&lt;meta property="og:image"&gt;</text><text x="45" y="315">&lt;meta property="og:description"&gt;</text></g><rect x="45" y="345" width="520" height="3" fill="#5c7598"/></g>
<path d="M735 535 H825" stroke="#64ddc4" stroke-width="8" stroke-linecap="round"/><path d="M805 513 L830 535 L805 557" fill="none" stroke="#64ddc4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(860 340)"><rect width="640" height="405" rx="28" fill="#f7f9fc"/><rect width="640" height="220" rx="28" fill="url(#art)"/><circle cx="490" cy="85" r="82" fill="#fff" opacity=".15"/><rect x="60" y="58" width="210" height="105" rx="16" fill="#fff" opacity=".22"/><path d="M85 133 L140 80 L185 119 L220 92 L252 135" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="270" fill="#1c2a42" font-family="Arial,sans-serif" font-size="29" font-weight="700">Preview title matches page</text><text x="42" y="314" fill="#52627b" font-family="Arial,sans-serif" font-size="23">Description, image and URL checked</text><text x="42" y="358" fill="#2563eb" font-family="Arial,sans-serif" font-size="20">example.com/article</text></g>
<text x="100" y="810" fill="#d6e4fa" font-family="Arial,sans-serif" font-size="24">A valid tag is only the start: image access, caching and platform rendering also matter.</text>
</svg>