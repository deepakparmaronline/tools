<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Diagnose API latency</title><desc id="desc">A request timeline separates context preparation, first token, generation and validation.</desc><rect width="1200" height="630" rx="28" fill="#14233a"/><text x="70" y="70" fill="#b8cbff" font-size="22" font-family="Arial,sans-serif" letter-spacing="4">TOOLBOXKART • PERFORMANCE</text><text x="70" y="140" fill="#fff" font-size="42" font-family="Arial,sans-serif" font-weight="700">Diagnose API latency</text><text x="70" y="184" fill="#d0d9f1" font-size="23" font-family="Arial,sans-serif">Measure each stage before changing the model</text><rect x="70" y="245" width="220" height="150" rx="20" fill="#e3ebfa"/><text x="180" y="303" text-anchor="middle" fill="#2e4a79" font-size="22" font-family="Arial,sans-serif" font-weight="700">Context</text><text x="180" y="343" text-anchor="middle" fill="#2e4a79" font-size="18" font-family="Arial,sans-serif">Queue and retrieval</text><rect x="320" y="245" width="220" height="150" rx="20" fill="#d9f0e9"/><text x="430" y="303" text-anchor="middle" fill="#236457" font-size="22" font-family="Arial,sans-serif" font-weight="700">First token</text><text x="430" y="343" text-anchor="middle" fill="#236457" font-size="18" font-family="Arial,sans-serif">Provider wait</text><rect x="570" y="245" width="220" height="150" rx="20" fill="#fff0dc"/><text x="680" y="303" text-anchor="middle" fill="#875323" font-size="22" font-family="Arial,sans-serif" font-weight="700">Generation</text><text x="680" y="343" text-anchor="middle" fill="#875323" font-size="18" font-family="Arial,sans-serif">Output time</text><rect x="820" y="245" width="260" height="150" rx="20" fill="#d9f0e9"/><text x="950" y="303" text-anchor="middle" fill="#236457" font-size="22" font-family="Arial,sans-serif" font-weight="700">Validation</text><text x="950" y="343" text-anchor="middle" fill="#236457" font-size="18" font-family="Arial,sans-serif">Ready for use</text><rect x="70" y="430" width="1010" height="65" rx="16" fill="#24395c" stroke="#8eacee" stroke-width="2"/><text x="100" y="471" fill="#f0f4ff" font-size="23" font-family="Arial,sans-serif">Track TTFT and completion time by task type</text><text x="70" y="560" fill="#fff" font-size="28" font-family="Arial,sans-serif" font-weight="700">ToolBoxKart • Practical AI and developer updates</text><text x="70" y="596" fill="#cbd6ec" font-size="20" font-family="Arial,sans-serif">Faster generation is only one part of the request</text></svg>