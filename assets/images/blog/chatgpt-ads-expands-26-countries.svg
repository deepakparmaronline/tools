<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">ChatGPT Ads expand to more countries</title><desc id="desc">A conversational discovery flow separates an identified sponsored placement from an AI answer.</desc>
<rect width="1600" height="900" rx="36" fill="#f5f8fc"/><rect x="90" y="80" width="1420" height="740" rx="30" fill="#fff" stroke="#dbe4ef" stroke-width="4"/>
<text x="150" y="160" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#102d43">CONVERSATIONAL DISCOVERY</text>
<rect x="150" y="220" width="580" height="190" rx="24" fill="#eef2ff" stroke="#c7d2fe" stroke-width="3"/>
<circle cx="205" cy="275" r="20" fill="#4f46e5"/><text x="245" y="284" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#312e81">User question</text>
<text x="195" y="335" font-family="Arial,sans-serif" font-size="24" fill="#334155">“Help me compare options for my goal.”</text>
<path d="M440 430 V485" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/><path d="M420 465 L440 490 L460 465" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="150" y="510" width="580" height="210" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
<text x="195" y="570" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#102d43">AI answer</text>
<text x="195" y="620" font-family="Arial,sans-serif" font-size="22" fill="#475569">Helpful information stays separate</text><text x="195" y="655" font-family="Arial,sans-serif" font-size="22" fill="#475569">from paid placements.</text>
<rect x="820" y="220" width="580" height="500" rx="24" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="3"/>
<text x="870" y="285" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#065f46">Sponsored placement</text>
<rect x="870" y="325" width="480" height="70" rx="16" fill="#d1fae5"/><text x="900" y="369" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#065f46">Clearly labeled ad</text>
<text x="870" y="455" font-family="Arial,sans-serif" font-size="23" fill="#065f46">Relevance and disclosure</text><text x="870" y="500" font-family="Arial,sans-serif" font-size="23" fill="#065f46">matter for trust.</text>
<rect x="870" y="565" width="480" height="95" rx="16" fill="#fff" stroke="#a7f3d0" stroke-width="2"/><text x="900" y="605" font-family="Arial,sans-serif" font-size="21" fill="#065f46">Expansion: +26 countries</text><text x="900" y="635" font-family="Arial,sans-serif" font-size="21" fill="#065f46">89 markets stated by OpenAI</text>
</svg>