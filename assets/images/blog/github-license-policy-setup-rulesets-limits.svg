<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>GitHub license policy setup</title><desc>A dependency change is checked against a license policy, reviewed for exceptions and approved before merge.</desc><rect width="1200" height="630" rx="28" fill="#f7f9fc"/><rect x="56" y="54" width="1088" height="522" rx="24" fill="#fff" stroke="#dbe4ef" stroke-width="3"/><text x="96" y="120" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#2563eb">DEPENDENCY GOVERNANCE</text><text x="96" y="170" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#0b1220">License rules before merge</text><rect x="96" y="230" width="260" height="140" rx="18" fill="#eef4ff" stroke="#2563eb" stroke-width="3"/><text x="226" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#0b1220">Dependency</text><text x="226" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#5d6b7e">Pull request</text><rect x="424" y="230" width="300" height="140" rx="18" fill="#e7f7f4" stroke="#0f9f8f" stroke-width="3"/><text x="574" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#0b1220">License policy</text><text x="574" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#5d6b7e">Ruleset check</text><rect x="792" y="230" width="256" height="140" rx="18" fill="#f0fdf4" stroke="#0f9f8f" stroke-width="3"/><text x="920" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#0b1220">Review / merge</text><text x="920" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#5d6b7e">Exception owner</text><text x="96" y="454" font-family="Arial,sans-serif" font-size="20" fill="#5d6b7e">Preview status, policy ownership and review paths must stay clear.</text></svg>