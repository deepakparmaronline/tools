<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Reliable AI API retries and fallbacks</title><desc id="desc">A service flow routes a request through a timeout check, a bounded retry and a safe fallback response.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172e35"/><stop offset="1" stop-color="#24534f"/></linearGradient></defs>
<rect width="1200" height="630" rx="28" fill="url(#bg)"/><circle cx="1030" cy="100" r="180" fill="#91d6c6" opacity=".12"/><text x="80" y="78" fill="#b9f0e2" font-size="22" font-family="Arial, sans-serif" letter-spacing="4">TOOLBOXKART • TOOLS GUIDE</text>
<g stroke="#b5e6da" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M280 285 H360"/><path d="M510 285 H590"/><path d="M740 285 H820"/><path d="M800 267 L820 285 L800 303"/></g>
<rect x="90" y="220" width="190" height="130" rx="22" fill="#f1f7f5"/><text x="185" y="270" text-anchor="middle" fill="#21443f" font-size="22" font-family="Arial, sans-serif" font-weight="700">Request</text><text x="185" y="308" text-anchor="middle" fill="#50716a" font-size="17" font-family="Arial, sans-serif">Budget + deadline</text>
<rect x="360" y="220" width="150" height="130" rx="22" fill="#d9eee8"/><text x="435" y="270" text-anchor="middle" fill="#21443f" font-size="22" font-family="Arial, sans-serif" font-weight="700">Timeout</text><text x="435" y="308" text-anchor="middle" fill="#50716a" font-size="17" font-family="Arial, sans-serif">Check result</text>
<rect x="590" y="220" width="150" height="130" rx="22" fill="#f4e7d7"/><text x="665" y="270" text-anchor="middle" fill="#674628" font-size="22" font-family="Arial, sans-serif" font-weight="700">Retry</text><text x="665" y="308" text-anchor="middle" fill="#8b6a48" font-size="17" font-family="Arial, sans-serif">Limited + spaced</text>
<rect x="820" y="220" width="280" height="130" rx="22" fill="#d7e8fa"/><text x="960" y="270" text-anchor="middle" fill="#29496d" font-size="22" font-family="Arial, sans-serif" font-weight="700">Safe fallback</text><text x="960" y="308" text-anchor="middle" fill="#55769a" font-size="17" font-family="Arial, sans-serif">Clear status to user</text>
<path d="M665 350 V405 H435 V350" fill="none" stroke="#e3bd8b" stroke-width="5" stroke-dasharray="10 10" stroke-linecap="round"/><text x="550" y="435" text-anchor="middle" fill="#e8d0b1" font-size="18" font-family="Arial, sans-serif">Retry only when safe</text>
<text x="80" y="515" fill="#ffffff" font-size="34" font-family="Arial, sans-serif" font-weight="700">Make failures predictable</text><text x="80" y="558" fill="#c5e6df" font-size="22" font-family="Arial, sans-serif">Timeouts • backoff • limits • monitoring</text>
</svg>