<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Prepare responsive images for desktop, tablet and mobile</title>
<desc id="desc">A landscape image source is delivered in three proportionally sized variants for desktop, tablet and mobile while preserving the same aspect ratio.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102035"/><stop offset="1" stop-color="#164e63"/></linearGradient><linearGradient id="scene" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs>
<rect width="1600" height="900" rx="40" fill="url(#bg)"/><circle cx="1380" cy="120" r="180" fill="#38bdf8" opacity=".11"/>
<text x="100" y="112" fill="#67e8f9" font-family="Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="4">WEB PERFORMANCE · DESIGN</text>
<text x="100" y="190" fill="#ffffff" font-family="Arial, sans-serif" font-size="54" font-weight="700">One image, the right size for each screen</text>
<text x="100" y="240" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="26">Preserve proportions · choose a useful crop · deliver fewer pixels</text>
