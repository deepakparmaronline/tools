<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Redirect chain checking for SEO</title>
<desc id="d">A simple flow from an old URL through multiple redirects to a final 200 OK page.</desc>
<rect width="1200" height="630" rx="28" fill="#f7f9fc"/>
<rect x="70" y="70" width="1060" height="490" rx="24" fill="#ffffff" stroke="#dbe4ef" stroke-width="3"/>
<text x="110" y="135" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#0b1220">Redirect Chain Check</text>
<text x="110" y="175" font-family="Arial, sans-serif" font-size="20" fill="#5d6b7e">Trace every hop and verify the final destination</text>
<rect x="100" y="245" width="205" height="100" rx="16" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/>
<text x="202" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0b1220">Old URL</text>
<text x="202" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#5d6b7e">/old-page</text>
<line x1="305" y1="295" x2="385" y2="295" stroke="#5d6b7e" stroke-width="4"/>
<polygon points="385,295 369,286 369,304" fill="#5d6b7e"/>
<text x="345" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2563eb">301</text>
<rect x="395" y="245" width="205" height="100" rx="16" fill="#f7f9fc" stroke="#dbe4ef" stroke-width="2"/>
<text x="497" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0b1220">Redirect 1</text>
<text x="497" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#5d6b7e">/old-path</text>
<line x1="600" y1="295" x2="680" y2="295" stroke="#5d6b7e" stroke-width="4"/>
<polygon points="680,295 664,286 664,304" fill="#5d6b7e"/>
<text x="640" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2563eb">301</text>
<rect x="690" y="245" width="205" height="100" rx="16" fill="#fffaf0" stroke="#b7791f" stroke-width="2"/>
<text x="792" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0b1220">Redirect 2</text>
<text x="792" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#5d6b7e">/new-path</text>
<line x1="895" y1="295" x2="975" y2="295" stroke="#5d6b7e" stroke-width="4"/>
<polygon points="975,295 959,286 959,304" fill="#5d6b7e"/>
<text x="935" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2563eb">200</text>
<rect x="985" y="245" width="105" height="100" rx="16" fill="#eefbf5" stroke="#0f9f6e" stroke-width="2"/>
<text x="1037" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0b1220">Final</text>
<text x="1037" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#5d6b7e">200 OK</text>
<rect x="120" y="405" width="960" height="90" rx="16" fill="#f7f9fc" stroke="#dbe4ef"/>
<text x="600" y="442" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0b1220">SEO audit goal</text>
<text x="600" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5d6b7e">Collapse unnecessary hops and point internal links directly to the final URL.</text>
</svg>