<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>Tenant-level LLM rate limits</title><desc>Requests pass through per-tenant request, token, concurrency and spend controls before reaching a shared model provider.</desc><rect width="1200" height="630" rx="28" fill="#f7f9fc"/><rect x="56" y="54" width="1088" height="522" rx="24" fill="#fff" stroke="#dbe4ef" stroke-width="3"/><text x="96" y="120" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#2563eb">MULTI-TENANT AI APPS</text><text x="96" y="170" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#0b1220">Control traffic before the model</text><rect x="96" y="236" width="200" height="126" rx="18" fill="#eef4ff" stroke="#2563eb" stroke-width="3"/><text x="196" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#0b1220">Tenant</text><text x="196" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#5d6b7e">Authenticated ID</text><rect x="360" y="220" width="390" height="158" rx="18" fill="#e7f7f4" stroke="#0f9f8f" stroke-width="3"/><text x="555" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#0b1220">Admission controls</text><text x="555" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#5d6b7e">Requests · tokens · concurrency</text><text x="555" y="334" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#5d6b7e">Spend and model policy</text><rect x="814" y="236" width="234" height="126" rx="18" fill="#f0fdf4" stroke="#0f9f8f" stroke-width="3"/><text x="931" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#0b1220">Model provider</text><text x="931" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#5d6b7e">Shared quota</text><text x="96" y="458" font-family="Arial,sans-serif" font-size="20" fill="#5d6b7e">Backpressure · bounded retries · usage reconciliation</text></svg>