<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Cloudflare AI discovery pilot: SEO impact</title><desc id="desc">Page signals help a crawler find useful URLs, after which an AI search system evaluates pages independently.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#263c56"/></linearGradient></defs><rect width="1200" height="630" rx="32" fill="url(#bg)"/><text x="64" y="72" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">AI DISCOVERY • PUBLISHER CONTROL</text><text x="64" y="140" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Help useful pages get found</text><text x="64" y="183" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="23">Discovery signals are not a ranking or referral guarantee.</text><g transform="translate(64 238)"><rect width="280" height="210" rx="20" fill="#17283e" stroke="#42607c"/><circle cx="56" cy="56" r="28" fill="#0f766e"/><path d="M42 56 H70 M56 42 V70" stroke="#ccfbf1" stroke-width="4" stroke-linecap="round"/><text x="28" y="116" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Page signals</text><text x="28" y="151" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Valid URLs, changes</text><text x="28" y="176" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">and duplicate checks</text><path d="M294 105 H330" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/><path d="M322 95 L334 105 L322 115" fill="none" stroke="#7dd3fc" stroke-width="4"/><rect x="346" width="280" height="210" rx="20" fill="#17283e" stroke="#42607c"/><circle cx="402" cy="56" r="28" fill="#1d4ed8"/><circle cx="402" cy="56" r="12" fill="none" stroke="#dbeafe" stroke-width="4"/><path d="M414 68 L428 82" stroke="#dbeafe" stroke-width="5" stroke-linecap="round"/><text x="374" y="116" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Discovery</text><text x="374" y="151" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Crawler finds</text><text x="374" y="176" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">candidate pages</text><path d="M640 105 H676" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/><path d="M668 95 L680 105 L668 115" fill="none" stroke="#7dd3fc" stroke-width="4"/><rect x="692" width="280" height="210" rx="20" fill="#17283e" stroke="#42607c"/><circle cx="748" cy="56" r="28" fill="#6d28d9"/><path d="M736 55 L745 64 L762 45" stroke="#ede9fe" stroke-width="5" fill="none" stroke-linecap="round"/><text x="720" y="116" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Evaluation</text><text x="720" y="151" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Relevance and</text><text x="720" y="176" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">usefulness still matter</text></g><text x="64" y="516" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="20" font-weight="700">DISCOVERY ≠ INDEXING ≠ CITATION</text><text x="64" y="556" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Keep pages accessible, distinct and governed by your crawl policy.</text></svg>