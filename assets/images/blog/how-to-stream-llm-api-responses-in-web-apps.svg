<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Stream responses in a web app</title><desc id="desc">A server sends incremental model events to a browser and tracks completion.</desc><rect width="1200" height="630" rx="28" fill="#14233a"/><text x="70" y="70" fill="#b8cbff" font-size="22" font-family="Arial,sans-serif" letter-spacing="4">TOOLBOXKART • WEB DEVELOPMENT</text><text x="70" y="140" fill="#fff" font-size="42" font-family="Arial,sans-serif" font-weight="700">Stream API responses</text><text x="70" y="184" fill="#d0d9f1" font-size="23" font-family="Arial,sans-serif">Send small events and handle the full lifecycle</text><rect x="70" y="245" width="270" height="150" rx="20" fill="#e3ebfa"/><text x="205" y="303" text-anchor="middle" fill="#2e4a79" font-size="24" font-family="Arial,sans-serif" font-weight="700">Provider</text><text x="205" y="343" text-anchor="middle" fill="#2e4a79" font-size="18" font-family="Arial,sans-serif">Model events</text><rect x="405" y="245" width="270" height="150" rx="20" fill="#d9f0e9"/><text x="540" y="303" text-anchor="middle" fill="#236457" font-size="24" font-family="Arial,sans-serif" font-weight="700">Backend</text><text x="540" y="343" text-anchor="middle" fill="#236457" font-size="18" font-family="Arial,sans-serif">Validate and filter</text><rect x="740" y="245" width="340" height="150" rx="20" fill="#fff0dc"/><text x="910" y="303" text-anchor="middle" fill="#875323" font-size="24" font-family="Arial,sans-serif" font-weight="700">Browser</text><text x="910" y="343" text-anchor="middle" fill="#875323" font-size="18" font-family="Arial,sans-serif">Render safe text</text><path d="M350 320 H395 M685 320 H730" stroke="#cbd6ec" stroke-width="5" stroke-linecap="round"/><path d="M385 309 L397 320 L385 331 M720 309 L732 320 L720 331" fill="none" stroke="#cbd6ec" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="70" y="430" width="1010" height="65" rx="16" fill="#24395c" stroke="#8eacee" stroke-width="2"/><text x="100" y="471" fill="#f0f4ff" font-size="23" font-family="Arial,sans-serif">Handle partial events, cancellation and errors</text><text x="70" y="560" fill="#fff" font-size="28" font-family="Arial,sans-serif" font-weight="700">ToolBoxKart • Practical AI and developer updates</text><text x="70" y="596" fill="#cbd6ec" font-size="20" font-family="Arial,sans-serif">Streaming can reduce perceived waiting time</text></svg>