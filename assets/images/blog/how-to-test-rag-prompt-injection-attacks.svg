<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>RAG prompt injection test workflow</title><desc>A security test pipeline checks user input, retrieved content, tool authorization and final output.</desc><rect width="1200" height="630" rx="28" fill="#f7f9fc"/><rect x="56" y="54" width="1088" height="522" rx="24" fill="#fff" stroke="#dbe4ef" stroke-width="3"/><text x="96" y="120" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#2563eb">RAG SECURITY QA</text><text x="96" y="170" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#0b1220">Test the trust boundary</text><g font-family="Arial,sans-serif" font-size="20" fill="#0b1220"><rect x="96" y="230" width="210" height="120" rx="16" fill="#eef4ff" stroke="#2563eb" stroke-width="3"/><text x="201" y="282" text-anchor="middle">User input</text><text x="201" y="316" text-anchor="middle" font-size="17" fill="#5d6b7e">Direct tests</text><rect x="344" y="230" width="210" height="120" rx="16" fill="#fff7ed" stroke="#b7791f" stroke-width="3"/><text x="449" y="282" text-anchor="middle">Retrieved data</text><text x="449" y="316" text-anchor="middle" font-size="17" fill="#5d6b7e">Indirect tests</text><rect x="592" y="230" width="210" height="120" rx="16" fill="#e7f7f4" stroke="#0f9f8f" stroke-width="3"/><text x="697" y="282" text-anchor="middle">Tool policy</text><text x="697" y="316" text-anchor="middle" font-size="17" fill="#5d6b7e">Least privilege</text><rect x="840" y="230" width="208" height="120" rx="16" fill="#f0fdf4" stroke="#0f9f8f" stroke-width="3"/><text x="944" y="282" text-anchor="middle">Safe output</text><text x="944" y="316" text-anchor="middle" font-size="17" fill="#5d6b7e">Pass / fail</text></g><text x="96" y="430" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0b1220">Record evidence</text><text x="96" y="466" font-family="Arial,sans-serif" font-size="18" fill="#5d6b7e">Document IDs · guardrail decisions · attempted tool calls · final outcome</text></svg>