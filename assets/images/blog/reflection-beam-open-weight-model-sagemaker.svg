<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>Reflection Beam deployment paths</title><desc>Two deployment options for the open-weight Beam model: a managed SageMaker endpoint and a configurable HyperPod inference cluster.</desc><rect width="1200" height="630" rx="28" fill="#f7f9fc"/><rect x="56" y="54" width="1088" height="522" rx="24" fill="#fff" stroke="#dbe4ef" stroke-width="3"/><text x="96" y="120" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#2563eb">OPEN-WEIGHT MODEL</text><text x="96" y="170" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#0b1220">Reflection Beam · 501B total</text><rect x="96" y="222" width="460" height="220" rx="22" fill="#eef4ff" stroke="#2563eb" stroke-width="3"/><rect x="644" y="222" width="460" height="220" rx="22" fill="#e7f7f4" stroke="#0f9f8f" stroke-width="3"/><text x="326" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#0b1220">Managed endpoint</text><text x="326" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#5d6b7e">SageMaker JumpStart</text><text x="874" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#0b1220">Cluster control</text><text x="874" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#5d6b7e">HyperPod + SGLang / vLLM</text><text x="96" y="502" font-family="Arial,sans-serif" font-size="20" fill="#5d6b7e">23B active parameters do not remove the 501B checkpoint storage needs.</text></svg>