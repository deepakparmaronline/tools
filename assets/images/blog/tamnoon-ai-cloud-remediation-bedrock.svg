<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Tamnoon AI cloud remediation on Bedrock</title><desc id="desc">A cloud security workflow moves from findings to reviewed changes and verified fixes.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#1d3552"/></linearGradient></defs><rect width="1200" height="630" rx="32" fill="url(#bg)"/><text x="64" y="72" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">CLOUD SECURITY • AGENTIC REMEDIATION</text><text x="64" y="134" fill="#fff" font-family="Arial,sans-serif" font-size="41" font-weight="700">Findings to verified fixes</text><text x="64" y="178" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="23">Investigate, approve and validate each change</text><g transform="translate(64 238)"><rect width="330" height="208" rx="20" fill="#173b59" stroke="#38bdf8" stroke-width="2"/><circle cx="42" cy="42" r="20" fill="#38bdf8"/><text x="42" y="49" text-anchor="middle" fill="#0b1220" font-family="Arial,sans-serif" font-size="18" font-weight="700">1</text><text x="24" y="94" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">Context</text><text x="24" y="132" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Find root cause</text><text x="24" y="160" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Confirm resource</text></g><g transform="translate(435 238)"><rect width="330" height="208" rx="20" fill="#1c3b36" stroke="#34d399" stroke-width="2"/><circle cx="42" cy="42" r="20" fill="#34d399"/><text x="42" y="49" text-anchor="middle" fill="#0b1220" font-family="Arial,sans-serif" font-size="18" font-weight="700">2</text><text x="24" y="94" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">Guardrails</text><text x="24" y="132" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Scope the action</text><text x="24" y="160" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Require approval</text></g><g transform="translate(806 238)"><rect width="330" height="208" rx="20" fill="#392d50" stroke="#c4b5fd" stroke-width="2"/><circle cx="42" cy="42" r="20" fill="#c4b5fd"/><text x="42" y="49" text-anchor="middle" fill="#0b1220" font-family="Arial,sans-serif" font-size="18" font-weight="700">3</text><text x="24" y="94" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">Validation</text><text x="24" y="132" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Apply the fix</text><text x="24" y="160" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Read state again</text></g><rect x="64" y="482" width="1072" height="72" rx="18" fill="#0b1220" stroke="#475569" stroke-width="2"/><text x="600" y="525" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">Evidence • Least privilege • Rollback</text><text x="64" y="600" fill="#94a3b8" font-family="Arial,sans-serif" font-size="16">Automation should stop when the proposed change cannot be verified.</text></svg>