<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">GitHub Copilot model policy REST API scopes</title>
<desc id="desc">An enterprise policy connects to team, app and organization policy scopes, with GET for reading settings and PATCH for approved updates.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#172554"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs>
<rect width="1600" height="900" rx="40" fill="url(#bg)"/>
<circle cx="1380" cy="140" r="190" fill="#2563eb" opacity=".13"/><circle cx="120" cy="760" r="190" fill="#10b981" opacity=".09"/>
<text x="100" y="112" fill="#93c5fd" font-family="Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="4">DEVELOPER GOVERNANCE</text>
<text x="100" y="188" fill="#ffffff" font-family="Arial, sans-serif" font-size="52" font-weight="700">Copilot model policy API</text>
<text x="100" y="238" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="26">Read the current policy · review the change · verify the result</text>
<rect x="565" y="295" width="470" height="125" rx="24" fill="#1e3a5f" stroke="#60a5fa" stroke-width="3"/>
<text x="800" y="345" text-anchor="middle" fill="#dbeafe" font-family="Arial, sans-serif" font-size="23" font-weight="700">ENTERPRISE POLICY</text>
<text x="800" y="387" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="29">Baseline and delegation</text>
<path d="M800 420 V470 H280 V520 M800 470 V520 M800 470 H1320 V520" stroke="url(#line)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="100" y="520" width="360" height="130" rx="22" fill="#183a42" stroke="#34d399" stroke-width="2"/>
<rect x="620" y="520" width="360" height="130" rx="22" fill="#183a42" stroke="#34d399" stroke-width="2"/>
<rect x="1140" y="520" width="360" height="130" rx="22" fill="#183a42" stroke="#34d399" stroke-width="2"/>
<text x="280" y="570" text-anchor="middle" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="22" font-weight="700">ORGANIZATIONS</text><text x="280" y="612" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="27">Org-level policies</text>
<text x="800" y="570" text-anchor="middle" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="22" font-weight="700">ENTERPRISE TEAMS</text><text x="800" y="612" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="27">Team-level policies</text>
<text x="1320" y="570" text-anchor="middle" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="22" font-weight="700">ENTERPRISE APPS</text><text x="1320" y="612" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="27">App-level policies</text>
<rect x="255" y="710" width="450" height="88" rx="18" fill="#1d3558" stroke="#60a5fa" stroke-width="2"/><text x="480" y="765" text-anchor="middle" fill="#dbeafe" font-family="Arial, sans-serif" font-size="30" font-weight="700">GET · Inspect state</text>
<rect x="895" y="710" width="450" height="88" rx="18" fill="#174e45" stroke="#34d399" stroke-width="2"/><text x="1120" y="765" text-anchor="middle" fill="#d1fae5" font-family="Arial, sans-serif" font-size="30" font-weight="700">PATCH · Approved change</text>
<text x="100" y="850" fill="#94a3b8" font-family="Arial, sans-serif" font-size="20">Scope and permissions matter. A policy setting is not always the final user access decision.</text>
