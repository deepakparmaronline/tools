<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">MoE inference kernel optimizations on H200</title><desc id="desc">Three kernel changes target matrix layout, FP8 backend selection and repeated JIT compilation.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#1d3552"/></linearGradient></defs><rect width="1200" height="630" rx="32" fill="url(#bg)"/><text x="64" y="72" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="3">INFERENCE ENGINEERING • H200</text><text x="64" y="135" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">MoE kernel tuning</text><text x="64" y="178" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="24">Three separate changes • AWS-reported results</text><g transform="translate(64 230)"><rect width="326" height="238" rx="20" fill="#173b59" stroke="#38bdf8" stroke-width="2"/><g fill="#38bdf8"><rect x="28" y="28" width="48" height="48" rx="7"/><rect x="83" y="28" width="48" height="48" rx="7" opacity=".7"/><rect x="138" y="28" width="48" height="48" rx="7" opacity=".45"/></g><text x="26" y="118" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Swap-AB</text><text x="26" y="155" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="31" font-weight="700">2–4%</text><text x="26" y="187" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Output throughput gain</text></g><g transform="translate(437 230)"><rect width="326" height="238" rx="20" fill="#1c3b36" stroke="#34d399" stroke-width="2"/><g fill="none" stroke="#34d399" stroke-width="4"><path d="M28 34h45v38H28zM83 34h45v38H83zM138 34h45v38H138z"/><path d="M50 52h18M105 52h18M160 52h18"/></g><text x="26" y="118" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">FP8 routing</text><text x="26" y="155" fill="#34d399" font-family="Arial,sans-serif" font-size="31" font-weight="700">10%</text><text x="26" y="187" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Throughput in tested path</text></g><g transform="translate(810 230)"><rect width="326" height="238" rx="20" fill="#392d50" stroke="#c4b5fd" stroke-width="2"/><g fill="none" stroke="#c4b5fd" stroke-width="4"><circle cx="45" cy="49" r="19"/><path d="M45 37v13l10 7M83 49h46M118 39l11 10-11 10"/></g><text x="26" y="118" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">JIT cleanup</text><text x="26" y="155" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="31" font-weight="700">9%</text><text x="26" y="187" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Faster first-token latency</text></g><rect x="64" y="496" width="1072" height="62" rx="16" fill="#0b1220" stroke="#475569" stroke-width="2"/><text x="600" y="535" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Not additive • Results depend on model, batch and serving stack</text><text x="64" y="598" fill="#94a3b8" font-family="Arial,sans-serif" font-size="16">Reported tests use NVIDIA H200 GPUs; verify with your own workload.</text></svg>