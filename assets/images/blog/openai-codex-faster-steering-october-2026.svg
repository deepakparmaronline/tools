<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Faster steering in Codex</title><desc id="desc">A running coding task receives a correction, while a separate queued task waits for the current run to finish.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171f39"/><stop offset="1" stop-color="#2b3d66"/></linearGradient></defs>
<rect width="1200" height="630" rx="28" fill="url(#bg)"/><circle cx="1050" cy="90" r="180" fill="#80aaff" opacity=".12"/><text x="80" y="78" fill="#a9c6ff" font-size="22" font-family="Arial, sans-serif" letter-spacing="4">TOOLBOXKART • CHATGPT</text>
<rect x="85" y="130" width="470" height="365" rx="24" fill="#f2f5fb"/><rect x="85" y="130" width="470" height="55" rx="24" fill="#dce5f3"/><circle cx="120" cy="158" r="7" fill="#7b91ad"/><circle cx="145" cy="158" r="7" fill="#7b91ad"/><circle cx="170" cy="158" r="7" fill="#7b91ad"/><text x="125" y="225" fill="#26354b" font-size="24" font-family="Arial, sans-serif" font-weight="700">Current run</text><rect x="125" y="250" width="360" height="48" rx="12" fill="#e1eafa"/><text x="145" y="281" fill="#354f7a" font-size="19" font-family="Arial, sans-serif">Inspect and fix validation</text><rect x="125" y="320" width="360" height="82" rx="12" fill="#cdece5"/><text x="145" y="352" fill="#23665e" font-size="18" font-family="Arial, sans-serif" font-weight="700">STEER</text><text x="145" y="379" fill="#23665e" font-size="17" font-family="Arial, sans-serif">Apply correction now</text><path d="M125 445 H465" stroke="#bdc8d7" stroke-width="5" stroke-linecap="round"/>
<path d="M590 300 H660" stroke="#9dbbff" stroke-width="8" stroke-linecap="round"/><path d="M644 282 L664 300 L644 318" fill="none" stroke="#9dbbff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="700" y="170" width="410" height="125" rx="22" fill="#223653" stroke="#91b1ff" stroke-width="2"/><text x="735" y="215" fill="#dbe6ff" font-size="25" font-family="Arial, sans-serif" font-weight="700">Queued follow-up</text><text x="735" y="255" fill="#b6c9e6" font-size="20" font-family="Arial, sans-serif">Runs after the current task</text><rect x="700" y="335" width="410" height="125" rx="22" fill="#223653" stroke="#72c6b4" stroke-width="2"/><text x="735" y="380" fill="#d5fff5" font-size="25" font-family="Arial, sans-serif" font-weight="700">Review the diff</text><text x="735" y="420" fill="#b6e5dc" font-size="20" font-family="Arial, sans-serif">Tests and approval still matter</text><text x="85" y="555" fill="#ffffff" font-size="34" font-family="Arial, sans-serif" font-weight="700">Guide the active task sooner</text><text x="85" y="592" fill="#bdcbe5" font-size="21" font-family="Arial, sans-serif">Steer the current run or queue the next one</text>
</svg>