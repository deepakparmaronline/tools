<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Amazon Bedrock global cross-Region inference</title><desc id="desc">A request starts in an Asia Pacific source Region and may be processed in another supported commercial AWS Region.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#1d3552"/></linearGradient></defs><rect width="1200" height="630" rx="32" fill="url(#bg)"/><text x="64" y="72" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="3">AMAZON BEDROCK • REGION ROUTING</text><text x="64" y="135" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Global inference route</text><text x="64" y="178" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="24">Source Region and processing Region can differ</text><g transform="translate(64 244)"><rect width="285" height="204" rx="20" fill="#173b59" stroke="#38bdf8" stroke-width="2"/><text x="24" y="46" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="18" font-weight="700">01 • SOURCE</text><text x="24" y="92" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">Asia Pacific</text><text x="24" y="130" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="19">App calls Bedrock</text><text x="24" y="158" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="19">Runtime endpoint</text></g><g stroke="#e2e8f0" stroke-width="4" fill="none"><path d="M360 344 H425"/><path d="M414 332 L428 344 L414 356Z"/></g><g transform="translate(440 244)"><rect width="300" height="204" rx="20" fill="#392d50" stroke="#c4b5fd" stroke-width="2"/><text x="24" y="46" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="18" font-weight="700">02 • PROFILE</text><text x="24" y="92" fill="#fff" font-family="Arial,sans-serif" font-size="26" font-weight="700">Global routing</text><text x="24" y="130" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="19">Selects a supported</text><text x="24" y="158" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="19">processing Region</text></g><g stroke="#e2e8f0" stroke-width="4" fill="none"><path d="M751 344 H816"/><path d="M805 332 L819 344 L805 356Z"/></g><g transform="translate(830 244)"><rect width="306" height="204" rx="20" fill="#1c3b36" stroke="#34d399" stroke-width="2"/><text x="24" y="46" fill="#34d399" font-family="Arial,sans-serif" font-size="18" font-weight="700">03 • PROCESSING</text><text x="24" y="92" fill="#fff" font-family="Arial,sans-serif" font-size="26" font-weight="700">Other Region</text><text x="24" y="130" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="19">Model may run outside</text><text x="24" y="158" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="19">the source country</text></g><rect x="64" y="482" width="1072" height="78" rx="18" fill="#0b1220" stroke="#475569" stroke-width="2"/><text x="600" y="513" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="21" font-weight="700">Billing and logs stay tied to source Region</text><text x="600" y="540" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="18">Do not assume local processing or data residency</text><text x="64" y="606" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15">Verify the profile destinations and retention requirements before production use.</text></svg>