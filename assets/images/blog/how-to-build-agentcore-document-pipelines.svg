<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Build document pipelines with Amazon Bedrock AgentCore</title><desc id="desc">Business documents pass through classification, structured extraction, validation and saved instructions for reuse.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#1d3c55"/></linearGradient></defs><rect width="1200" height="630" rx="32" fill="url(#bg)"/><text x="64" y="72" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">AGENTIC DOCUMENT PROCESSING</text><text x="64" y="140" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Classify → Extract → Validate</text><text x="64" y="183" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="23">Save corrected instructions so known formats take a faster path.</text><g transform="translate(64 238)"><rect width="240" height="178" rx="20" fill="#17283e" stroke="#42607c"/><rect x="24" y="24" width="48" height="58" rx="8" fill="#1d4ed8"/><path d="M34 40 H62 M34 52 H62 M34 64 H55" stroke="#dbeafe" stroke-width="3" stroke-linecap="round"/><text x="24" y="118" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Classify</text><text x="24" y="149" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Read and identify</text><path d="M252 89 H278" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/><path d="M270 79 L282 89 L270 99" fill="none" stroke="#7dd3fc" stroke-width="4"/><rect x="294" width="240" height="178" rx="20" fill="#17283e" stroke="#42607c"/><circle cx="336" cy="52" r="26" fill="#0f766e"/><path d="M324 42 H348 M324 52 H348 M324 62 H342" stroke="#ccfbf1" stroke-width="3" stroke-linecap="round"/><text x="318" y="118" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Extract</text><text x="318" y="149" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Return structured data</text><path d="M546 89 H572" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/><path d="M564 79 L576 89 L564 99" fill="none" stroke="#7dd3fc" stroke-width="4"/><rect x="588" width="240" height="178" rx="20" fill="#17283e" stroke="#42607c"/><circle cx="630" cy="52" r="26" fill="#6d28d9"/><path d="M617 52 L627 62 L644 42" stroke="#ede9fe" stroke-width="4" fill="none" stroke-linecap="round"/><text x="612" y="118" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Validate</text><text x="612" y="149" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Check schema and rules</text><path d="M840 89 H866" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/><path d="M858 79 L870 89 L858 99" fill="none" stroke="#7dd3fc" stroke-width="4"/><rect x="882" width="190" height="178" rx="20" fill="#17283e" stroke="#42607c"/><rect x="906" y="26" width="48" height="52" rx="8" fill="#155e75"/><path d="M918 40 H942 M918 52 H942 M918 64 H936" stroke="#cffafe" stroke-width="3" stroke-linecap="round"/><text x="906" y="118" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Reuse</text><text x="906" y="149" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Save instructions</text></g><text x="64" y="498" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="20" font-weight="700">VALIDATION FAILS → REFINE → TEST AGAIN</text><text x="64" y="538" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Keep business rules and human approval around high-impact outputs.</text></svg>