<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">AWS Trust in Depth for AI agents</title><desc id="desc">Five control layers show scope, identity, runtime boundaries, observation and proof for AI agents.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#203b55"/></linearGradient></defs><rect width="1200" height="630" rx="32" fill="url(#bg)"/><text x="64" y="72" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">AI AGENT GOVERNANCE</text><text x="64" y="140" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Scope. Know. Bound. Observe. Prove.</text><text x="64" y="183" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="23">Layered controls turn autonomy into an auditable workflow.</text><g transform="translate(64 240)"><g><rect width="198" height="176" rx="20" fill="#17283e" stroke="#42607c"/><circle cx="42" cy="42" r="22" fill="#0f766e"/><text x="42" y="50" text-anchor="middle" fill="#ccfbf1" font-family="Arial,sans-serif" font-size="22" font-weight="700">1</text><text x="24" y="94" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Scope</text><text x="24" y="126" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">Define the job</text><text x="24" y="150" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">and allowed tools</text></g><g transform="translate(216 0)"><rect width="198" height="176" rx="20" fill="#17283e" stroke="#42607c"/><circle cx="42" cy="42" r="22" fill="#1d4ed8"/><text x="42" y="50" text-anchor="middle" fill="#dbeafe" font-family="Arial,sans-serif" font-size="22" font-weight="700">2</text><text x="24" y="94" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Know</text><text x="24" y="126" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">Track identity</text><text x="24" y="150" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">and authority</text></g><g transform="translate(432 0)"><rect width="198" height="176" rx="20" fill="#17283e" stroke="#42607c"/><circle cx="42" cy="42" r="22" fill="#7c2d12"/><text x="42" y="50" text-anchor="middle" fill="#ffedd5" font-family="Arial,sans-serif" font-size="22" font-weight="700">3</text><text x="24" y="94" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Bound</text><text x="24" y="126" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">Enforce rules</text><text x="24" y="150" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">outside the model</text></g><g transform="translate(648 0)"><rect width="198" height="176" rx="20" fill="#17283e" stroke="#42607c"/><circle cx="42" cy="42" r="22" fill="#6d28d9"/><text x="42" y="50" text-anchor="middle" fill="#ede9fe" font-family="Arial,sans-serif" font-size="22" font-weight="700">4</text><text x="24" y="94" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Observe</text><text x="24" y="126" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">Trace actions</text><text x="24" y="150" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">and outcomes</text></g><g transform="translate(864 0)"><rect width="198" height="176" rx="20" fill="#17283e" stroke="#42607c"/><circle cx="42" cy="42" r="22" fill="#155e75"/><text x="42" y="50" text-anchor="middle" fill="#cffafe" font-family="Arial,sans-serif" font-size="22" font-weight="700">5</text><text x="24" y="94" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Prove</text><text x="24" y="126" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">Verify precise</text><text x="24" y="150" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">rules when possible</text></g></g><text x="64" y="490" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="20" font-weight="700">CONTROL THE ACTION • KEEP THE EVIDENCE</text><text x="64" y="530" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Formal proof helps with precise rules; human judgment still matters.</text></svg>