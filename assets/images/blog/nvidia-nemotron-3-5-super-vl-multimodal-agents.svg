<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">NVIDIA Nemotron 3.5 Super VL multimodal model</title><desc id="desc">One multimodal model connects text, charts, documents, video and tool use in an agent workflow.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#263e54"/></linearGradient></defs><rect width="1200" height="630" rx="32" fill="url(#bg)"/><text x="64" y="72" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">NVIDIA NEMOTRON 3.5 SUPER VL</text><text x="64" y="140" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">One model, many input types</text><text x="64" y="183" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="23">Reasoning and tool use connect visual evidence to actions.</text><g transform="translate(64 235)"><circle cx="526" cy="100" r="86" fill="#17283e" stroke="#7dd3fc" stroke-width="3"/><circle cx="526" cy="100" r="60" fill="#1d4ed8" opacity=".85"/><text x="526" y="92" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Nemotron</text><text x="526" y="122" text-anchor="middle" fill="#dbeafe" font-family="Arial,sans-serif" font-size="18">3.5 Super VL</text><path d="M438 100 H320 M614 100 H732 M526 14 V-4 M526 186 V207" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/><rect x="0" y="42" width="286" height="116" rx="18" fill="#17283e" stroke="#42607c"/><text x="26" y="82" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Text &amp; code</text><text x="26" y="116" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Instructions and tools</text><rect x="766" y="42" width="286" height="116" rx="18" fill="#17283e" stroke="#42607c"/><text x="792" y="82" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Charts &amp; docs</text><text x="792" y="116" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Tables and page layout</text><rect x="336" y="210" width="380" height="86" rx="18" fill="#17283e" stroke="#42607c"/><text x="526" y="245" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Video + tool actions</text><text x="526" y="273" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Context, reasoning and execution</text></g><text x="64" y="548" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="20" font-weight="700">120B TOTAL PARAMETERS • 12B ACTIVE PER TOKEN</text><text x="64" y="580" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Reported speed and quality depend on the workload and serving setup.</text></svg>