<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">GitHub push attribution separates commit identities</title><desc id="desc">The author and committer are declared metadata; the pusher is the authenticated account that sent the commit.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#1d3552"/></linearGradient></defs><rect width="1200" height="630" rx="32" fill="url(#bg)"/><text x="64" y="72" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="3">GIT AUDIT TRAIL • PUBLIC PREVIEW</text><text x="64" y="135" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Who pushed this commit?</text><text x="64" y="178" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="24">Keep declared metadata separate from authenticated identity</text><g transform="translate(64 228)"><rect width="300" height="176" rx="20" fill="#173b59" stroke="#38bdf8" stroke-width="2"/><circle cx="48" cy="45" r="22" fill="#38bdf8"/><text x="82" y="53" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Author</text><text x="24" y="102" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="19">Who is credited</text><text x="24" y="130" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="19">with writing the change</text></g><g transform="translate(390 228)"><rect width="300" height="176" rx="20" fill="#392d50" stroke="#c4b5fd" stroke-width="2"/><circle cx="48" cy="45" r="22" fill="#c4b5fd"/><text x="82" y="53" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Committer</text><text x="24" y="102" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="19">Who is recorded</text><text x="24" y="130" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="19">as creating the commit</text></g><g transform="translate(716 228)"><rect width="420" height="176" rx="20" fill="#1c3b36" stroke="#34d399" stroke-width="2"/><circle cx="48" cy="45" r="22" fill="#34d399"/><text x="82" y="53" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Pusher</text><text x="24" y="102" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="19">Authenticated account that</text><text x="24" y="130" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="19">sent the commit to GitHub</text></g><path d="M64 434 H1136" stroke="#475569" stroke-width="2"/><rect x="64" y="458" width="1072" height="86" rx="18" fill="#0b1220" stroke="#fbbf24" stroke-width="2"/><text x="600" y="494" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="20" font-weight="700">Committer must match pusher</text><text x="600" y="523" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">A policy check for verified email identity — not proof that code is safe.</text><text x="64" y="598" fill="#94a3b8" font-family="Arial,sans-serif" font-size="16">Limited public preview for GitHub Enterprise customers.</text></svg>