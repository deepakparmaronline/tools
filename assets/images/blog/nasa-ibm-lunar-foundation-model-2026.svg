<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">NASA IBM Lunar Foundation Model</title>
<desc id="desc">Illustration of an AI model analyzing layered lunar observation data to map craters and possible ice deposits.</desc>
<rect width="1600" height="900" fill="#0b1020"/>
<circle cx="1220" cy="220" r="135" fill="#d9dde7" opacity=".95"/>
<circle cx="1175" cy="175" r="28" fill="#aeb5c2" opacity=".8"/><circle cx="1270" cy="260" r="42" fill="#aeb5c2" opacity=".75"/><circle cx="1230" cy="135" r="18" fill="#aeb5c2" opacity=".7"/>
<path d="M120 650 C360 480 520 500 720 610 S1080 760 1420 570" fill="none" stroke="#6d7892" stroke-width="5" opacity=".8"/>
<path d="M160 690 C420 530 570 555 760 660 S1100 790 1450 610" fill="none" stroke="#303a55" stroke-width="70" opacity=".8"/>
<circle cx="350" cy="610" r="55" fill="none" stroke="#d7dce5" stroke-width="12"/><circle cx="350" cy="610" r="18" fill="#d7dce5"/>
<circle cx="610" cy="655" r="42" fill="none" stroke="#d7dce5" stroke-width="10"/>
<circle cx="900" cy="700" r="68" fill="none" stroke="#d7dce5" stroke-width="12"/>
<g stroke="#7f8cff" stroke-width="4" opacity=".9"><path d="M350 610 L800 450"/><path d="M610 655 L800 450"/><path d="M900 700 L800 450"/><path d="M800 450 L1220 220"/></g>
<rect x="610" y="335" width="380" height="230" rx="28" fill="#151d35" stroke="#9aa6c4" stroke-width="4"/>
<text x="800" y="395" text-anchor="middle" fill="#f2f4f8" font-family="Arial, sans-serif" font-size="38" font-weight="700">LUNAR AI</text>
<text x="800" y="445" text-anchor="middle" fill="#b9c2d6" font-family="Arial, sans-serif" font-size="27">Foundation Model</text>
<text x="800" y="492" text-anchor="middle" fill="#b9c2d6" font-family="Arial, sans-serif" font-size="23">multi-layer lunar data</text>
<text x="800" y="535" text-anchor="middle" fill="#b9c2d6" font-family="Arial, sans-serif" font-size="23">→ mapping + classification</text>
<text x="115" y="115" fill="#f2f4f8" font-family="Arial, sans-serif" font-size="48" font-weight="700">NASA + IBM</text>
<text x="115" y="165" fill="#b9c2d6" font-family="Arial, sans-serif" font-size="30">AI for lunar surface science</text>
<text x="115" y="815" fill="#d9dde7" font-family="Arial, sans-serif" font-family="Arial, sans-serif" font-size="28">Craters • possible ice deposits • geospatial observations</text>
</svg>
