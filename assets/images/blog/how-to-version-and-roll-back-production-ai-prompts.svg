<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Version and roll back AI prompts</title><desc id="desc">A controlled prompt release process from source control through tests and staged rollout to monitoring and rollback.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#3b1e4a"/></linearGradient></defs><rect width="1200" height="630" rx="32" fill="url(#bg)"/><text x="72" y="82" fill="#f0abfc" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">PROMPT OPERATIONS</text><text x="72" y="145" fill="#ffffff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Version every production prompt</text><text x="72" y="187" fill="#e9d5ff" font-family="Arial,sans-serif" font-size="23">Test • release gradually • roll back safely</text><g transform="translate(72 258)"><rect width="220" height="166" rx="18" fill="#2c2140" stroke="#f0abfc" stroke-width="2"/><rect x="34" y="30" width="68" height="84" rx="8" fill="#f0abfc" opacity=".18" stroke="#f0abfc" stroke-width="3"/><path d="M48 50 H88 M48 66 H88 M48 82 H78" stroke="#f0abfc" stroke-width="4" stroke-linecap="round"/><text x="130" y="58" fill="#ffffff" font-family="Arial,sans-serif" font-size="19" font-weight="700">Source</text><text x="130" y="83" fill="#e9d5ff" font-family="Arial,sans-serif" font-size="16">Versioned</text><text x="130" y="105" fill="#e9d5ff" font-family="Arial,sans-serif" font-size="16">prompt</text></g><g transform="translate(338 258)"><rect width="220" height="166" rx="18" fill="#183647" stroke="#7dd3fc" stroke-width="2"/><circle cx="67" cy="69" r="35" fill="#7dd3fc" opacity=".18" stroke="#7dd3fc" stroke-width="3"/><path d="M50 69 L62 81 L84 54" fill="none" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="117" y="62" fill="#ffffff" font-family="Arial,sans-serif" font-size="19" font-weight="700">Regression</text><text x="117" y="88" fill="#bae6fd" font-family="Arial,sans-serif" font-size="16">Test set</text><text x="117" y="110" fill="#bae6fd" font-family="Arial,sans-serif" font-size="16">and review</text></g><g transform="translate(604 258)"><rect width="220" height="166" rx="18" fill="#173b36" stroke="#6ee7b7" stroke-width="2"/><path d="M44 89 A31 31 0 0 1 94 44" fill="none" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round"/><path d="M84 37 L98 42 L94 56" fill="none" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="117" y="62" fill="#ffffff" font-family="Arial,sans-serif" font-size="19" font-weight="700">Canary</text><text x="117" y="88" fill="#a7f3d0" font-family="Arial,sans-serif" font-size="16">Small rollout</text><text x="117" y="110" fill="#a7f3d0" font-family="Arial,sans-serif" font-size="16">first</text></g><g transform="translate(870 258)"><rect width="258" height="166" rx="18" fill="#3b2b22" stroke="#fdba74" stroke-width="2"/><path d="M48 54 A29 29 0 1 1 48 91" fill="none" stroke="#fdba74" stroke-width="5" stroke-linecap="round"/><path d="M40 44 L49 55 L62 47" fill="none" stroke="#fdba74" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="105" y="62" fill="#ffffff" font-family="Arial,sans-serif" font-size="19" font-weight="700">Monitor</text><text x="105" y="88" fill="#fed7aa" font-family="Arial,sans-serif" font-size="16">or revert</text><text x="105" y="110" fill="#fed7aa" font-family="Arial,sans-serif" font-size="16">to known-good</text></g><g stroke="#cbd5e1" stroke-width="3" fill="none"><path d="M292 340 H338"/><path d="M558 340 H604"/><path d="M824 340 H870"/></g><g fill="#cbd5e1"><path d="M329 331 L341 340 L329 349Z"/><path d="M595 331 L607 340 L595 349Z"/><path d="M861 331 L873 340 L861 349Z"/></g><rect x="72" y="470" width="1056" height="88" rx="16" fill="#111827" stroke="#6b7280" stroke-width="2"/><text x="600" y="505" fill="#ffffff" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">Know which version served each request</text><text x="600" y="536" fill="#d1d5db" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">Version IDs make failures traceable and rollback repeatable.</text></svg>