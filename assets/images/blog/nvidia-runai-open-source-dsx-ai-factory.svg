<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">NVIDIA Run:ai opens GPU orchestration</title><desc id="desc">Four Run:ai building blocks support Kubernetes GPU scheduling, sharing, resource policy and workload mapping.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#1d3552"/></linearGradient></defs><rect width="1200" height="630" rx="32" fill="url(#bg)"/><text x="64" y="72" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="3">KUBERNETES • AI INFRASTRUCTURE</text><text x="64" y="135" fill="#fff" font-family="Arial,sans-serif" font-size="43" font-weight="700">Run:ai goes open source</text><text x="64" y="178" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="24">Four building blocks for shared GPU capacity</text><g transform="translate(64 230)"><rect width="254" height="218" rx="20" fill="#173b59" stroke="#38bdf8" stroke-width="2"/><circle cx="46" cy="47" r="20" fill="#38bdf8"/><path d="M36 47h20M46 37v20" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/><text x="24" y="98" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">KAI Scheduler</text><text x="24" y="132" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Places workloads</text><text x="24" y="158" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">on available GPUs</text></g><g transform="translate(344 230)"><rect width="254" height="218" rx="20" fill="#1c3b36" stroke="#34d399" stroke-width="2"/><g fill="#34d399"><rect x="25" y="29" width="31" height="31" rx="5"/><rect x="63" y="29" width="31" height="31" rx="5" opacity=".8"/><rect x="101" y="29" width="31" height="31" rx="5" opacity=".6"/></g><text x="24" y="98" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">GPU Fractioning</text><text x="24" y="132" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Shares device</text><text x="24" y="158" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">capacity</text></g><g transform="translate(624 230)"><rect width="254" height="218" rx="20" fill="#392d50" stroke="#c4b5fd" stroke-width="2"/><g fill="none" stroke="#c4b5fd" stroke-width="4"><rect x="26" y="28" width="34" height="28" rx="5"/><rect x="68" y="28" width="34" height="28" rx="5"/><path d="M43 57v13h42V57"/></g><text x="24" y="98" fill="#fff" font-family="Arial,sans-serif" font-size="21" font-weight="700">Resource Mgmt</text><text x="24" y="132" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Projects, quotas</text><text x="24" y="158" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">and fair sharing</text></g><g transform="translate(904 230)"><rect width="232" height="218" rx="20" fill="#3b3030" stroke="#fbbf24" stroke-width="2"/><g stroke="#fbbf24" stroke-width="3" fill="none"><rect x="24" y="28" width="30" height="28" rx="5"/><rect x="70" y="28" width="30" height="28" rx="5"/><path d="M54 42h16M39 56v14h46V56"/></g><text x="24" y="98" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">Workload Map</text><text x="24" y="132" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Shared workload</text><text x="24" y="158" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">descriptions</text></g><rect x="64" y="482" width="1072" height="74" rx="18" fill="#0b1220" stroke="#475569" stroke-width="2"/><text x="600" y="526" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Scheduling • Sharing • Governance • Observability</text><text x="64" y="598" fill="#94a3b8" font-family="Arial,sans-serif" font-size="16">Evaluate each component against your own cluster and workload mix.</text></svg>