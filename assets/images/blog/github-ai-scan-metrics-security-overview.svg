<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">GitHub AI Scan metrics in security overview</title><desc id="desc">A security dashboard summarizes findings, resolved findings, remediation rate and autofix activity.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#1d3552"/></linearGradient></defs><rect width="1200" height="630" rx="32" fill="url(#bg)"/><text x="64" y="72" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="3">APPLICATION SECURITY • PUBLIC PREVIEW</text><text x="64" y="135" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">AI Scan metrics</text><text x="64" y="178" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="24">Findings, response and autofix activity</text><g transform="translate(64 222)"><rect width="1072" height="284" rx="22" fill="#0b1220" stroke="#475569" stroke-width="2"/><rect x="28" y="28" width="245" height="112" rx="14" fill="#173b59" stroke="#38bdf8" stroke-width="2"/><text x="48" y="62" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">AI Scan findings</text><text x="48" y="112" fill="#fff" font-family="Arial,sans-serif" font-size="36" font-weight="700">Generated</text><rect x="292" y="28" width="245" height="112" rx="14" fill="#1c3b36" stroke="#34d399" stroke-width="2"/><text x="312" y="62" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Response</text><text x="312" y="112" fill="#fff" font-family="Arial,sans-serif" font-size="36" font-weight="700">Resolved</text><rect x="556" y="28" width="245" height="112" rx="14" fill="#392d50" stroke="#c4b5fd" stroke-width="2"/><text x="576" y="62" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Trend</text><text x="576" y="112" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">Rate over time</text><rect x="820" y="28" width="224" height="112" rx="14" fill="#3b3030" stroke="#fbbf24" stroke-width="2"/><text x="840" y="62" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Autofix</text><text x="840" y="112" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">Applied</text><path d="M48 222 L160 202 L270 214 L380 174 L490 188 L600 150 L710 164 L820 124 L930 140 L1024 105" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 222 L160 202 L270 214 L380 174 L490 188 L600 150 L710 164 L820 124 L930 140 L1024 105 L1024 244 L48 244Z" fill="#38bdf8" opacity=".1"/></g><rect x="64" y="528" width="1072" height="44" rx="14" fill="#0b1220"/><text x="600" y="557" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700">Dashboard signals guide review; they do not prove code is secure.</text><text x="64" y="606" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15">AI Scan findings remain advisory during public preview.</text></svg>