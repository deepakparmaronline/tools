<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Gemini launchpads for government agent projects</title><desc id="desc">An original workflow diagram connects agency mission data, embedded engineering teams, purpose-built Gemini agents and monitored outcomes.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111d3b"/><stop offset="1" stop-color="#29375d"/></linearGradient><linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6b9cff"/><stop offset="1" stop-color="#63dbc7"/></linearGradient></defs>
<rect width="1600" height="900" rx="42" fill="url(#bg)"/><circle cx="1370" cy="150" r="240" fill="#8faeff" opacity=".08"/>
<text x="100" y="120" fill="#83e4d3" font-family="Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="5">TOOLBOXKART • ENTERPRISE AI</text><text x="100" y="205" fill="#fff" font-family="Arial,sans-serif" font-size="58" font-weight="700">Gemini Launchpads</text><text x="100" y="266" fill="#d6e2fb" font-family="Arial,sans-serif" font-size="30">A delivery model for US federal agencies</text>
<g transform="translate(100 365)"><rect width="300" height="250" rx="24" fill="#172947" stroke="#57739e" stroke-width="3"/><text x="150" y="58" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">Mission data</text><path d="M80 100 H220 M80 135 H220 M80 170 H180" stroke="#8faeff" stroke-width="13" stroke-linecap="round"/><text x="150" y="220" text-anchor="middle" fill="#b9cce9" font-family="Arial,sans-serif" font-size="20">Systems of record</text></g>
<path d="M420 490 H520" stroke="#63dbc7" stroke-width="8" stroke-linecap="round"/><path d="M500 468 L525 490 L500 512" fill="none" stroke="#63dbc7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(545 365)"><rect width="300" height="250" rx="24" fill="#1a3452" stroke="#63dbc7" stroke-width="3"/><text x="150" y="58" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">Embedded team</text><circle cx="100" cy="115" r="25" fill="#6b9cff"/><circle cx="200" cy="115" r="25" fill="#63dbc7"/><path d="M55 178 Q100 130 145 178 M155 178 Q200 130 245 178" fill="none" stroke="#b8d6ed" stroke-width="13" stroke-linecap="round"/><text x="150" y="220" text-anchor="middle" fill="#c5d8ed" font-family="Arial,sans-serif" font-size="20">Engineers + domain experts</text></g>
<path d="M865 490 H965" stroke="#63dbc7" stroke-width="8" stroke-linecap="round"/><path d="M945 468 L970 490 L945 512" fill="none" stroke="#63dbc7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(990 365)"><rect width="300" height="250" rx="24" fill="#172947" stroke="#57739e" stroke-width="3"/><text x="150" y="58" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">Gemini agents</text><g transform="translate(65 90)" fill="url(#node)"><rect width="70" height="60" rx="12"/><rect x="100" width="70" height="60" rx="12"/><rect x="50" y="80" width="70" height="60" rx="12"/></g><text x="150" y="220" text-anchor="middle" fill="#b9cce9" font-family="Arial,sans-serif" font-size="20">Purpose-built workflows</text></g>
<path d="M1310 490 H1375" stroke="#63dbc7" stroke-width="8" stroke-linecap="round"/><path d="M1355 468 L1380 490 L1355 512" fill="none" stroke="#63dbc7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1385" y="395" width="115" height="190" rx="20" fill="#244765" stroke="#63dbc7" stroke-width="3"/><path d="M1412 455 L1438 480 L1476 432" fill="none" stroke="#63dbc7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="1442" y="525" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Review</text><text x="1442" y="550" text-anchor="middle" fill="#d6e2fb" font-family="Arial,sans-serif" font-size="16">Measure</text>
<rect x="100" y="705" width="1400" height="105" rx="22" fill="#fff" opacity=".08"/><text x="145" y="750" fill="#fff" font-family="Arial,sans-serif" font-size="26">The announcement describes a delivery model, not proof that every workflow is deployed.</text><text x="145" y="785" fill="#c9d8f1" font-family="Arial,sans-serif" font-size="21">Data access, approvals, auditability and mission-specific evaluation still need design.</text>
