<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Calculate LLM API cost per task</title><desc id="desc">A simple cost breakdown for input tokens, output tokens, tools and successful tasks.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18283e"/><stop offset="1" stop-color="#34516a"/></linearGradient></defs>
<rect width="1200" height="630" rx="28" fill="url(#bg)"/><circle cx="1020" cy="90" r="190" fill="#82c8d0" opacity=".12"/><text x="80" y="78" fill="#b4e8eb" font-size="22" font-family="Arial, sans-serif" letter-spacing="4">TOOLBOXKART • TOOLS GUIDE</text>
<rect x="90" y="150" width="470" height="340" rx="24" fill="#f4f7fa"/><text x="130" y="205" fill="#263a50" font-size="26" font-family="Arial, sans-serif" font-weight="700">Monthly estimate</text><rect x="130" y="235" width="380" height="58" rx="12" fill="#dbe9f3"/><text x="155" y="271" fill="#315b79" font-size="20" font-family="Arial, sans-serif">Input tokens</text><rect x="130" y="310" width="380" height="58" rx="12" fill="#d8eee9"/><text x="155" y="346" fill="#27695d" font-size="20" font-family="Arial, sans-serif">Output tokens</text><rect x="130" y="385" width="380" height="58" rx="12" fill="#f6e6d3"/><text x="155" y="421" fill="#8b5b2f" font-size="20" font-family="Arial, sans-serif">Tools + retries</text>
<rect x="650" y="175" width="450" height="240" rx="28" fill="#21374e" stroke="#a3c8e3" stroke-width="3"/><text x="875" y="235" text-anchor="middle" fill="#dceaf6" font-size="22" font-family="Arial, sans-serif">Cost per successful task</text><text x="875" y="305" text-anchor="middle" fill="#ffffff" font-size="48" font-family="Arial, sans-serif" font-weight="700">Total ÷ success</text><text x="875" y="360" text-anchor="middle" fill="#b9d3e6" font-size="20" font-family="Arial, sans-serif">Measure the whole workflow</text>
<text x="90" y="550" fill="#ffffff" font-size="34" font-family="Arial, sans-serif" font-weight="700">Estimate before launch</text><text x="90" y="590" fill="#c5d8e7" font-size="22" font-family="Arial, sans-serif">Rates change. Use live prices and real usage logs.</text>
</svg>