<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">GitHub Agentic Autofix for code scanning</title><desc id="desc">A security alert moves through agent investigation, proposed code changes, validation and a draft pull request.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#1d3552"/></linearGradient></defs><rect width="1200" height="630" rx="32" fill="url(#bg)"/><text x="64" y="72" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">GITHUB SECURITY • AGENTIC AUTOFIX</text><text x="64" y="140" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Alert → Fix → Review</text><text x="64" y="183" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="23">AI prepares the patch. Engineers keep the merge decision.</text><g transform="translate(64 238)"><rect width="238" height="205" rx="20" fill="#17283e" stroke="#42607c"/><rect x="24" y="26" width="54" height="54" rx="14" fill="#7f1d1d"/><path d="M51 38 L65 64 H37 Z" fill="#fecaca"/><text x="24" y="115" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Alert</text><text x="24" y="151" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Code scanning</text><text x="24" y="175" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">finding</text><path d="M250 102 H276" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/><path d="M268 92 L280 102 L268 112" fill="none" stroke="#7dd3fc" stroke-width="4"/><rect x="292" width="238" height="205" rx="20" fill="#17283e" stroke="#42607c"/><circle cx="329" cy="52" r="26" fill="#0f766e"/><path d="M318 52 L326 60 L341 43" stroke="#ccfbf1" stroke-width="5" fill="none" stroke-linecap="round"/><text x="316" y="115" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Agent</text><text x="316" y="151" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Investigate</text><text x="316" y="175" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">and propose</text><path d="M542 102 H568" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/><path d="M560 92 L572 102 L560 112" fill="none" stroke="#7dd3fc" stroke-width="4"/><rect x="584" width="238" height="205" rx="20" fill="#17283e" stroke="#42607c"/><rect x="608" y="26" width="54" height="54" rx="14" fill="#1d4ed8"/><path d="M621 43 H650 M621 54 H650 M621 65 H642" stroke="#dbeafe" stroke-width="4" stroke-linecap="round"/><text x="608" y="115" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Validate</text><text x="608" y="151" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">CodeQL check</text><text x="608" y="175" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">where supported</text><path d="M834 102 H860" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/><path d="M852 92 L864 102 L852 112" fill="none" stroke="#7dd3fc" stroke-width="4"/><rect x="876" width="196" height="205" rx="20" fill="#17283e" stroke="#42607c"/><rect x="900" y="26" width="54" height="54" rx="14" fill="#6d28d9"/><path d="M913 42 H941 V64 H913 Z M919 36 H947 V58" stroke="#ede9fe" stroke-width="3" fill="none"/><text x="900" y="115" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Draft PR</text><text x="900" y="151" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Human review</text><text x="900" y="175" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">before merge</text></g><text x="64" y="516" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="20" font-weight="700">AUTOMATION PREPARES • REVIEWERS APPROVE</text><text x="64" y="556" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Validation is useful evidence, not a guarantee that the patch is safe.</text></svg>