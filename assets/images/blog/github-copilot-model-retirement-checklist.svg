<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">GitHub Copilot model retirement migration checklist</title><desc id="desc">An original checklist graphic shows inventory, replacement mapping, workflow tests and rollout monitoring for model deprecations.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111b32"/><stop offset="1" stop-color="#253d60"/></linearGradient><linearGradient id="check" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#79e2c7"/><stop offset="1" stop-color="#79aaff"/></linearGradient></defs>
<rect width="1600" height="900" rx="42" fill="url(#bg)"/><circle cx="1370" cy="160" r="230" fill="#78aaff" opacity=".08"/>
<text x="100" y="120" fill="#86e6d2" font-family="Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="5">TOOLBOXKART • DEVELOPER WORKFLOWS</text><text x="100" y="205" fill="#fff" font-family="Arial,sans-serif" font-size="57" font-weight="700">Copilot Model Retirement</text><text x="100" y="267" fill="#d4e2f8" font-family="Arial,sans-serif" font-size="30">A controlled migration, not a blind switch</text>
<g transform="translate(100 340)"><rect width="650" height="400" rx="28" fill="#162744" stroke="#56739a" stroke-width="3"/><text x="55" y="65" fill="#fff" font-family="Arial,sans-serif" font-size="31" font-weight="700">Migration checklist</text><g fill="url(#check)"><rect x="55" y="105" width="38" height="38" rx="8"/><rect x="55" y="175" width="38" height="38" rx="8"/><rect x="55" y="245" width="38" height="38" rx="8"/><rect x="55" y="315" width="38" height="38" rx="8"/></g><g stroke="#16304a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M64 123 L73 132 L86 114"/><path d="M64 193 L73 202 L86 184"/><path d="M64 263 L73 272 L86 254"/><path d="M64 333 L73 342 L86 324"/></g><g fill="#dbe7fa" font-family="Arial,sans-serif" font-size="25"><text x="120" y="133">Inventory pinned model IDs</text><text x="120" y="203">Map replacements and access</text><text x="120" y="273">Test real prompts and tools</text><text x="120" y="343">Monitor quality and failures</text></g></g>
<g transform="translate(830 355)"><rect width="280" height="150" rx="24" fill="#203c60" stroke="#79aaff" stroke-width="3"/><text x="140" y="60" text-anchor="middle" fill="#dbe7fa" font-family="Arial,sans-serif" font-size="23">Retiring model</text><text x="140" y="108" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Legacy ID</text><path d="M300 75 H390" stroke="#79e2c7" stroke-width="8" stroke-linecap="round"/><path d="M370 53 L395 75 L370 97" fill="none" stroke="#79e2c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="410" width="260" height="150" rx="24" fill="#204d60" stroke="#79e2c7" stroke-width="3"/><text x="540" y="60" text-anchor="middle" fill="#d2fff2" font-family="Arial,sans-serif" font-size="23">Supported option</text><text x="540" y="108" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">New ID</text>
<rect y="195" width="670" height="190" rx="24" fill="#fff" opacity=".07"/><text x="35" y="245" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">Test before rollout</text><text x="35" y="292" fill="#d2e0f5" font-family="Arial,sans-serif" font-size="22">• code edits • agent tools • latency</text><text x="35" y="330" fill="#d2e0f5" font-family="Arial,sans-serif" font-size="22">• refusals • output quality • budgets</text><text x="35" y="368" fill="#d2e0f5" font-family="Arial,sans-serif" font-size="22">• permissions • fallback behavior</text></g>
<text x="100" y="810" fill="#d4e2f8" font-family="Arial,sans-serif" font-size="24">Replacement names are suggestions; verify current access and behavior in your organization.</text>
</svg>