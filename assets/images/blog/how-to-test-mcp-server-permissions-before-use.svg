<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">MCP server permissions review</title><desc id="desc">A four-step security review for AI tools: inventory, scope permissions, test in isolation and monitor changes.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#123c4c"/></linearGradient></defs><rect width="1200" height="630" rx="32" fill="url(#bg)"/><text x="72" y="82" fill="#5eead4" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">AI AGENT SECURITY</text><text x="72" y="145" fill="#ffffff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Review MCP permissions</text><text x="72" y="187" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="23">Do not trust the description alone</text><g transform="translate(72 258)"><rect width="240" height="180" rx="18" fill="#15334a" stroke="#67e8f9" stroke-width="2"/><circle cx="120" cy="55" r="30" fill="#67e8f9" opacity=".18" stroke="#67e8f9" stroke-width="3"/><path d="M105 54 L116 65 L137 42" fill="none" stroke="#67e8f9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="112" fill="#ffffff" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">Inventory</text><text x="120" y="143" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Tools and schemas</text></g><g transform="translate(350 258)"><rect width="240" height="180" rx="18" fill="#173b36" stroke="#34d399" stroke-width="2"/><path d="M120 27 L151 39 V65 C151 84 135 96 120 103 C105 96 89 84 89 65 V39Z" fill="#34d399" opacity=".2" stroke="#34d399" stroke-width="3"/><path d="M107 63 L117 73 L135 52" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round"/><text x="120" y="125" fill="#ffffff" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">Scope access</text><text x="120" y="151" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Least privilege</text></g><g transform="translate(628 258)"><rect width="240" height="180" rx="18" fill="#3c2d20" stroke="#fbbf24" stroke-width="2"/><rect x="86" y="30" width="68" height="55" rx="8" fill="#fbbf24" opacity=".18" stroke="#fbbf24" stroke-width="3"/><path d="M101 47 H139 M101 60 H139 M101 73 H127" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/><text x="120" y="125" fill="#ffffff" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">Test safely</text><text x="120" y="151" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Sandbox and deny tests</text></g><g transform="translate(906 258)"><rect width="222" height="180" rx="18" fill="#30294b" stroke="#c4b5fd" stroke-width="2"/><circle cx="111" cy="58" r="29" fill="#c4b5fd" opacity=".18" stroke="#c4b5fd" stroke-width="3"/><path d="M111 39 V58 L125 67" fill="none" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/><text x="111" y="125" fill="#ffffff" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">Monitor</text><text x="111" y="151" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Versions and logs</text></g><g stroke="#94a3b8" stroke-width="3" fill="none"><path d="M312 348 H350"/><path d="M590 348 H628"/><path d="M868 348 H906"/></g><g fill="#94a3b8"><path d="M341 339 L353 348 L341 357Z"/><path d="M619 339 L631 348 L619 357Z"/><path d="M897 339 L909 348 L897 357Z"/></g><rect x="72" y="486" width="1056" height="72" rx="16" fill="#0b1220" stroke="#475569" stroke-width="2"/><text x="600" y="516" fill="#ffffff" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle">Enforce controls outside the model</text><text x="600" y="542" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">A system prompt is not an access-control boundary.</text></svg>