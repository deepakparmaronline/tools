<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>RAG retrieval quality metrics</title><desc>Ranked document results are evaluated with Recall at K, Mean Reciprocal Rank and Normalized Discounted Cumulative Gain.</desc><rect width="1200" height="630" rx="28" fill="#f7f9fc"/><rect x="56" y="54" width="1088" height="522" rx="24" fill="#fff" stroke="#dbe4ef" stroke-width="3"/><text x="96" y="120" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#2563eb">RAG EVALUATION</text><text x="96" y="170" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#0b1220">Measure the ranked results</text><rect x="96" y="230" width="550" height="58" rx="12" fill="#e7f7f4"/><text x="124" y="266" font-family="Arial,sans-serif" font-size="20" fill="#0b1220">1 · Highly relevant document</text><rect x="96" y="300" width="550" height="58" rx="12" fill="#f8fafc" stroke="#dbe4ef"/><text x="124" y="336" font-family="Arial,sans-serif" font-size="20" fill="#0b1220">2 · Not relevant</text><rect x="96" y="370" width="550" height="58" rx="12" fill="#e7f7f4"/><text x="124" y="406" font-family="Arial,sans-serif" font-size="20" fill="#0b1220">3 · Partly relevant document</text><rect x="706" y="230" width="342" height="96" rx="16" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/><text x="877" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#0b1220">Recall@k</text><text x="877" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#5d6b7e">Were relevant docs found?</text><rect x="706" y="344" width="342" height="96" rx="16" fill="#e7f7f4" stroke="#0f9f8f" stroke-width="2"/><text x="877" y="384" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#0b1220">MRR · NDCG</text><text x="877" y="416" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#5d6b7e">Were they ranked well?</text><text x="96" y="500" font-family="Arial,sans-serif" font-size="19" fill="#5d6b7e">Label relevance first; compare systems on the same queries and cutoff.</text></svg>