<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">CSV validation before importing data</title>
<desc id="desc">A clean data table with five validation checks: headers, consistent row widths, quoted values, type checks and duplicate detection.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#164e63"/></linearGradient></defs>
<rect width="1600" height="900" rx="40" fill="url(#bg)"/><circle cx="1380" cy="120" r="190" fill="#22d3ee" opacity=".10"/>
<text x="100" y="112" fill="#67e8f9" font-family="Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="4">DATA QUALITY WORKFLOW</text>
<text x="100" y="190" fill="#ffffff" font-family="Arial, sans-serif" font-size="54" font-weight="700">Validate before you import</text>
<text x="100" y="240" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="26">Check structure first, then check what each value means</text>
<rect x="100" y="300" width="900" height="430" rx="24" fill="#f8fafc"/>
<rect x="100" y="300" width="900" height="72" rx="24" fill="#dbeafe"/><rect x="100" y="348" width="900" height="24" fill="#dbeafe"/>
<g font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1e3a8a"><text x="145" y="345">order_id</text><text x="360" y="345">created_at</text><text x="600" y="345">region</text><text x="790" y="345">amount</text></g>
<g stroke="#d6dee8" stroke-width="2"><path d="M100 440 H1000 M100 510 H1000 M100 580 H1000 M100 650 H1000"/><path d="M310 300 V730 M550 300 V730 M750 300 V730"/></g>
<g font-family="Arial, sans-serif" font-size="22" fill="#334155"><text x="145" y="418">000184</text><text x="360" y="418">2026-10-18</text><text x="600" y="418">West</text><text x="790" y="418">125.00</text><text x="145" y="488">000185</text><text x="360" y="488">2026-10-18</text><text x="600" y="488">North</text><text x="790" y="488">80.50</text><text x="145" y="558">000186</text><text x="360" y="558">2026-10-19</text><text x="600" y="558">East</text><text x="790" y="558">46.00</text><text x="145" y="628">000187</text><text x="360" y="628">2026-10-19</text><text x="600" y="628">South</text><text x="790" y="628">210.75</text></g>
<rect x="1050" y="300" width="450" height="430" rx="24" fill="#132e42" stroke="#2a6478" stroke-width="2"/>
<g font-family="Arial, sans-serif" font-size="25" fill="#e2e8f0"><circle cx="1100" cy="370" r="18" fill="#34d399"/><path d="M1091 370 L1098 377 L1110 362" fill="none" stroke="#052e2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1140" y="379">Header match</text><circle cx="1100" cy="445" r="18" fill="#34d399"/><path d="M1091 445 L1098 452 L1110 437" fill="none" stroke="#052e2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1140" y="454">Consistent rows</text><circle cx="1100" cy="520" r="18" fill="#34d399"/><path d="M1091 520 L1098 527 L1110 512" fill="none" stroke="#052e2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1140" y="529">Valid quoting</text><circle cx="1100" cy="595" r="18" fill="#34d399"/><path d="M1091 595 L1098 602 L1110 587" fill="none" stroke="#052e2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1140" y="604">Correct data types</text><circle cx="1100" cy="670" r="18" fill="#34d399"/><path d="M1091 670 L1098 677 L1110 662" fill="none" stroke="#052e2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1140" y="679">Duplicate review</text></g>
<text x="100" y="805" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="700">A successful import is not proof of correct data.</text>
<text x="100" y="850" fill="#9fb8c8" font-family="Arial, sans-serif" font-size="20">ToolboxKart · Practical developer and data workflows</text>
</svg>