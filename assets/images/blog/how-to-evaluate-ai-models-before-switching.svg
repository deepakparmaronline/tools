<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Evaluate AI models before switching</title><desc id="desc">A scorecard compares model quality, latency, cost, reliability and privacy before a production change.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#28213c"/><stop offset="1" stop-color="#4c3c62"/></linearGradient></defs>
