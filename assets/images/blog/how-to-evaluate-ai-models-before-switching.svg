<rect x="855" y="250" width="180" height="165" rx="20" fill="#e2d9ef"/><path d="M900 330 l25 25 58 -67" fill="none" stroke="#5c477d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><text x="945" y="390" text-anchor="middle" fill="#49395e" font-size="18" font-family="Arial, sans-serif">Compare evidence</text>
