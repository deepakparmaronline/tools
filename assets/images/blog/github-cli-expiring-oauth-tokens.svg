<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">GitHub CLI expiring OAuth tokens</title><desc id="desc">A short-lived access token is refreshed by GitHub CLI while scripts request current credentials instead of caching old values.</desc>
<rect width="1600" height="900" rx="36" fill="#f4f7fb"/><rect x="90" y="80" width="1420" height="740" rx="30" fill="#fff" stroke="#dbe4ef" stroke-width="4"/>
<text x="150" y="160" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#102d43">SHORT-LIVED CREDENTIAL FLOW</text>
<rect x="150" y="250" width="330" height="280" rx="24" fill="#102d43"/><text x="195" y="315" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#fff">GitHub CLI</text><text x="195" y="370" font-family="Arial,sans-serif" font-size="22" fill="#cbd5e1">gh auth login</text><text x="195" y="415" font-family="Arial,sans-serif" font-size="22" fill="#cbd5e1">Token refresh</text><text x="195" y="460" font-family="Arial,sans-serif" font-size="22" fill="#cbd5e1">Credential helper</text>
<path d="M500 390 H630" stroke="#0f9f8f" stroke-width="10" stroke-linecap="round"/><path d="M610 365 L640 390 L610 415" fill="none" stroke="#0f9f8f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="660" y="250" width="320" height="280" rx="24" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="3"/><text x="705" y="315" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#065f46">Token lifecycle</text><rect x="705" y="350" width="230" height="58" rx="12" fill="#d1fae5"/><text x="725" y="386" font-family="Arial,sans-serif" font-size="21" fill="#065f46">Short expiry</text><rect x="705" y="425" width="230" height="58" rx="12" fill="#d1fae5"/><text x="725" y="461" font-family="Arial,sans-serif" font-size="21" fill="#065f46">Refresh when needed</text>
<path d="M1000 390 H1125" stroke="#0f9f8f" stroke-width="10" stroke-linecap="round"/><path d="M1105 365 L1135 390 L1105 415" fill="none" stroke="#0f9f8f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1155" y="250" width="290" height="280" rx="24" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/><text x="1195" y="315" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#1d4ed8">Git / scripts</text><text x="1195" y="375" font-family="Arial,sans-serif" font-size="21" fill="#1e40af">Request fresh</text><text x="1195" y="410" font-family="Arial,sans-serif" font-size="21" fill="#1e40af">credentials</text><text x="1195" y="465" font-family="Arial,sans-serif" font-size="21" fill="#1e40af">Avoid stale cache</text>
<rect x="150" y="600" width="1295" height="105" rx="20" fill="#fff7ed" stroke="#fed7aa" stroke-width="3"/><text x="190" y="645" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#9a3412">Migration check</text><text x="190" y="680" font-family="Arial,sans-serif" font-size="22" fill="#9a3412">Scripts that store a token once may fail after expiry; test CI and credential helpers before opting in.</text>
</svg>