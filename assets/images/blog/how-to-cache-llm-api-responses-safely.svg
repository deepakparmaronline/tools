<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Response cache design</title><desc id="desc">A cache uses versioned keys, freshness checks and separate user scopes.</desc><rect width="1200" height="630" rx="28" fill="#14233a"/><text x="70" y="70" fill="#b8cbff" font-size="22" font-family="Arial,sans-serif" letter-spacing="4">TOOLBOXKART • API ENGINEERING</text><text x="70" y="140" fill="#fff" font-size="42" font-family="Arial,sans-serif" font-weight="700">Design a safe response cache</text><text x="70" y="184" fill="#d0d9f1" font-size="23" font-family="Arial,sans-serif">Reuse the right answer with clear freshness rules</text><rect x="70" y="245" width="290" height="150" rx="20" fill="#e3ebfa"/><text x="215" y="303" text-anchor="middle" fill="#2e4a79" font-size="24" font-family="Arial,sans-serif" font-weight="700">Versioned key</text><text x="215" y="343" text-anchor="middle" fill="#2e4a79" font-size="18" font-family="Arial,sans-serif">Input and model</text><rect x="420" y="245" width="290" height="150" rx="20" fill="#d9f0e9"/><text x="565" y="303" text-anchor="middle" fill="#236457" font-size="24" font-family="Arial,sans-serif" font-weight="700">Freshness</text><text x="565" y="343" text-anchor="middle" fill="#236457" font-size="18" font-family="Arial,sans-serif">TTL and invalidation</text><rect x="770" y="245" width="310" height="150" rx="20" fill="#fff0dc"/><text x="925" y="303" text-anchor="middle" fill="#875323" font-size="24" font-family="Arial,sans-serif" font-weight="700">Access scope</text><text x="925" y="343" text-anchor="middle" fill="#875323" font-size="18" font-family="Arial,sans-serif">User and tenant</text><rect x="70" y="430" width="1010" height="65" rx="16" fill="#24395c" stroke="#8eacee" stroke-width="2"/><text x="100" y="471" fill="#f0f4ff" font-size="23" font-family="Arial,sans-serif">Check freshness and access before returning a cached answer</text><text x="70" y="560" fill="#fff" font-size="28" font-family="Arial,sans-serif" font-weight="700">ToolBoxKart • Practical AI and developer updates</text><text x="70" y="596" fill="#cbd6ec" font-size="20" font-family="Arial,sans-serif">Application response cache is not prompt cache</text></svg>