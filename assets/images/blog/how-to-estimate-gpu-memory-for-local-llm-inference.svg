<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Estimate local LLM GPU memory</title><desc id="desc">Three memory components combine into the GPU budget: model weights, KV cache and runtime overhead.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#1d3552"/></linearGradient></defs><rect width="1200" height="630" rx="32" fill="url(#bg)"/><text x="72" y="84" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">LOCAL AI • HARDWARE PLANNING</text><text x="72" y="146" fill="#ffffff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Estimate GPU memory</text><text x="72" y="188" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="23">Weights + KV cache + runtime overhead</text><g transform="translate(72 250)"><rect width="310" height="190" rx="20" fill="#173b59" stroke="#38bdf8" stroke-width="2"/><rect x="24" y="28" width="262" height="24" rx="7" fill="#38bdf8"/><rect x="24" y="65" width="218" height="24" rx="7" fill="#38bdf8" opacity=".78"/><rect x="24" y="102" width="174" height="24" rx="7" fill="#38bdf8" opacity=".56"/><text x="24" y="158" fill="#ffffff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Model weights</text></g><g transform="translate(445 250)"><rect width="310" height="190" rx="20" fill="#1c3b36" stroke="#34d399" stroke-width="2"/><g fill="#34d399"><rect x="24" y="28" width="48" height="45" rx="7"/><rect x="82" y="28" width="48" height="45" rx="7"/><rect x="140" y="28" width="48" height="45" rx="7"/><rect x="198" y="28" width="48" height="45" rx="7"/><rect x="24" y="82" width="48" height="45" rx="7" opacity=".8"/><rect x="82" y="82" width="48" height="45" rx="7" opacity=".8"/><rect x="140" y="82" width="48" height="45" rx="7" opacity=".8"/><rect x="198" y="82" width="48" height="45" rx="7" opacity=".8"/></g><text x="24" y="158" fill="#ffffff" font-family="Arial,sans-serif" font-size="23" font-weight="700">KV cache</text></g><g transform="translate(818 250)"><rect width="310" height="190" rx="20" fill="#392d50" stroke="#c4b5fd" stroke-width="2"/><g fill="#c4b5fd"><circle cx="64" cy="54" r="22"/><circle cx="125" cy="54" r="22" opacity=".8"/><circle cx="186" cy="54" r="22" opacity=".6"/><rect x="36" y="91" width="202" height="20" rx="7" opacity=".8"/></g><text x="24" y="158" fill="#ffffff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Runtime buffers</text></g><g stroke="#e2e8f0" stroke-width="3" fill="none"><path d="M382 345 H425"/><path d="M755 345 H798"/></g><g fill="#e2e8f0"><path d="M416 336 L428 345 L416 354Z"/><path d="M789 336 L801 345 L789 354Z"/></g><rect x="72" y="480" width="1056" height="78" rx="18" fill="#0b1220" stroke="#475569" stroke-width="2"/><text x="600" y="512" fill="#ffffff" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle">Measure the real context length and concurrency</text><text x="600" y="540" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">A model file that fits is not proof that the full workload fits.</text></svg>