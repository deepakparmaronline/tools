name: ToolboxKart quality checks

on:
  push:
    branches: [main]
    paths-ignore:
      - seo/quality-status.json
      - seo/tool_publishing_queue.md
      - articles/progress.md
      - 'articles/help-scout-*/notes.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toolboxkart-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install PHP XML support
        run: |
          sudo apt-get update
          sudo apt-get install --yes php-cli php-xml

      - name: Check changed PHP syntax
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PULL_REQUEST_BASE_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE_SHA"
          else
            base="$(git rev-parse HEAD^)"
          fi

          git diff --diff-filter=ACMR --name-only -z "$base" "$GITHUB_SHA" -- '*.php' > "$RUNNER_TEMP/changed-php-files"

          if [ -s "$RUNNER_TEMP/changed-php-files" ]; then
            while IFS= read -r -d '' file; do
              php -l "$file"
            done < "$RUNNER_TEMP/changed-php-files"
          else
            echo "No PHP files changed in this run."
          fi

      - name: Validate the static sitemap
        run: php tools/validate-sitemap.php

      - name: Run software content tests
        run: |
          python3 tests/help_scout_research.py
          python3 tests/help_scout_draft.py
          python3 tests/alternatives.py
          python3 tests/software_decisions.py
          python3 tests/software_indexes.py

      - name: Run publication rendering test
        run: |
          php -S 127.0.0.1:8765 preview-router.php > "$RUNNER_TEMP/php-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8765/ > /dev/null
          python3 tests/publication.py

      - name: Record exact passing commit and release Help Scout
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CHECKED_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          checked=os.environ["CHECKED_COMMIT"]
          run_id=os.environ["RUN_ID"]
          repo=os.environ["REPOSITORY"]
          changed=set(subprocess.check_output(["git","diff-tree","--no-commit-id","--name-only","-r",checked],text=True).splitlines())
          status={"workflow":"ToolboxKart quality checks","status":"passed","commit":checked,"checked_at":datetime.now(timezone.utc).replace(microsecond=0).isoformat(),"run_url":f"https://github.com/{repo}/actions/runs/{run_id}"}
          Path("seo/quality-status.json").write_text(json.dumps(status,indent=2)+"\n",encoding="utf-8")
          required={"articles/help-scout-hub/article.md","articles/help-scout-pricing/article.md","articles/help-scout-review/article.md","articles/help-scout-how-to-use/article.md","articles/help-scout-alternatives/article.md","articles/help-scout-vs-zendesk/article.md","data/software-pages.php","alternatives/articles/help-scout-alternatives.php","data/post-2026-11-22-help-scout-review.php","reviews/help-scout-review/index.php","includes/alternatives.php","tests/help_scout_draft.py"}
          if required.issubset(changed):
              qp=Path("seo/tool_publishing_queue.md")
              q=qp.read_text(encoding="utf-8")
              q,n=re.subn(r"(?m)^(\|\s*8\s*\|\s*Help Scout\s*\|.*\|\s*)in_progress(\s*\|\s*)$",r"\1published\2",q,count=1)
              if n!=1: raise SystemExit("Could not mark the exact Help Scout queue row published.")
              q=q.replace("<!-- Order 8 remains in_progress until the exact content-commit quality gate passes. -->","").rstrip()+"\n"
              qp.write_text(q,encoding="utf-8")
              day=datetime.now(ZoneInfo("Asia/Kolkata")).date().isoformat()
              pp=Path("articles/progress.md")
              p=pp.read_text(encoding="utf-8")
              p+=(f"\n\n### Help Scout publication closeout - {day}\n\n"
                  f"- Quality status passed for exact content commit `{checked}`; workflow: https://github.com/{repo}/actions/runs/{run_id}.\n"
                  "- All six public routes are registered, internally linked and discoverable through their dynamic child sitemap sources.\n"
                  "- Help Scout is published. Next queued item: Order 9, ManyChat.\n")
              pp.write_text(p,encoding="utf-8")
              for name in ["help-scout-hub","help-scout-pricing","help-scout-review","help-scout-how-to-use","help-scout-alternatives","help-scout-vs-zendesk"]:
                  np=Path(f"articles/{name}/notes.md")
                  note=np.read_text(encoding="utf-8")
                  note=note.replace("Quality gate: pending until seo/quality-status.json reports status=passed for the exact content commit.",f"Quality gate: passed for exact content commit {checked}.")
                  np.write_text(note,encoding="utf-8")
          PY
          git add seo/quality-status.json seo/tool_publishing_queue.md articles/progress.md articles/help-scout-*/notes.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record passing quality check and release Help Scout [skip ci]"
          git push origin HEAD:main