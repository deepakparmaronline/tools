name: ToolboxKart quality checks

on:
  push:
    branches: [main]
    paths-ignore:
      - seo/quality-status.json
      - seo/tool_publishing_queue.md
      - articles/progress.md
      - 'articles/*/notes.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toolboxkart-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install PHP XML support
        run: |
          sudo apt-get update
          sudo apt-get install --yes php-cli php-xml

      - name: Check changed PHP syntax
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PULL_REQUEST_BASE_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE_SHA"
          else
            base="$(git rev-parse HEAD^)"
          fi

          git diff --diff-filter=ACMR --name-only -z "$base" "$GITHUB_SHA" -- '*.php' > "$RUNNER_TEMP/changed-php-files"

          if [ -s "$RUNNER_TEMP/changed-php-files" ]; then
            while IFS= read -r -d '' file; do
              php -l "$file"
            done < "$RUNNER_TEMP/changed-php-files"
          else
            echo "No PHP files changed in this run."
          fi

      - name: Validate the static sitemap
        run: php tools/validate-sitemap.php

      - name: Run software content tests
        run: |
          python3 tests/help_scout_research.py
          python3 tests/help_scout_draft.py
          python3 tests/manychat_draft.py
          python3 tests/alternatives.py
          python3 tests/software_decisions.py
          python3 tests/software_indexes.py

      - name: Run publication rendering test
        run: |
          php -S 127.0.0.1:8765 preview-router.php > "$RUNNER_TEMP/php-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8765/ > /dev/null
          python3 tests/publication.py

      - name: Record exact passing commit and release an eligible cluster
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CHECKED_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          checked = os.environ["CHECKED_COMMIT"]
          run_id = os.environ["RUN_ID"]
          repo = os.environ["REPOSITORY"]
          manifest_path = Path("seo/publication-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8")) if manifest_path.is_file() else {}
          publication = None

          if manifest.get("publish_ready") is True:
              required = manifest.get("required_files", [])
              missing = [path for path in required if not Path(path).is_file()]
              if missing:
                  raise SystemExit("Publication manifest is ready but required files are missing: " + ", ".join(missing))

              order = int(manifest["order"])
              tool = str(manifest["tool"])
              queue_path = Path("seo/tool_publishing_queue.md")
              queue = queue_path.read_text(encoding="utf-8")
              published_pattern = rf"(?m)^\|\s*{order}\s*\|\s*{re.escape(tool)}\s*\|[^\n]*\|\s*published\s*\|$"
              in_progress_pattern = rf"(?m)^(\|\s*{order}\s*\|\s*{re.escape(tool)}\s*\|[^\n]*\|\s*)in_progress(\s*\|\s*)$"
              if not re.search(published_pattern, queue):
                  queue, count = re.subn(in_progress_pattern, r"\1published\2", queue, count=1)
                  if count != 1:
                      raise SystemExit(f"Could not mark Order {order} {tool} published from its in_progress state.")
                  queue_path.write_text(queue, encoding="utf-8")

              day = datetime.now(ZoneInfo("Asia/Kolkata")).date().isoformat()
              progress_path = Path("articles/progress.md")
              progress = progress_path.read_text(encoding="utf-8")
              marker = f"### {tool} publication closeout - {day}"
              if marker not in progress:
                  urls = "\n".join(f"- {url}" for url in manifest.get("canonical_urls", []))
                  maps = "\n".join(f"- {url}: {sitemap}" for url, sitemap in manifest.get("child_sitemaps", {}).items())
                  progress += (
                      f"\n\n{marker}\n\n"
                      f"- Quality status passed for exact content commit {checked}; workflow: https://github.com/{repo}/actions/runs/{run_id}.\n"
                      "- All six public routes, registries, internal links and dynamic child sitemap entries passed the repository tests.\n"
                      f"- Public URLs:\n{urls}\n"
                      f"- Child sitemap discovery:\n{maps}\n"
                  )
                  progress_path.write_text(progress, encoding="utf-8")

              for name in manifest.get("notes_files", []):
                  note_path = Path(name)
                  if not note_path.is_file():
                      raise SystemExit(f"Publication notes file missing: {name}")
                  note = note_path.read_text(encoding="utf-8")
                  note = re.sub(r"(?m)^- Quality gate: pending.*$", f"- Quality gate: passed for exact content commit {checked}.", note)
                  note_path.write_text(note, encoding="utf-8")

              publication = {
                  "order": order,
                  "tool": tool,
                  "status": "published",
                  "canonical_urls": manifest.get("canonical_urls", []),
                  "child_sitemaps": manifest.get("child_sitemaps", {})
              }

          status = {
              "workflow": "ToolboxKart quality checks",
              "status": "passed",
              "commit": checked,
              "checked_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              "run_url": f"https://github.com/{repo}/actions/runs/{run_id}",
              "publication": publication
          }
          Path("seo/quality-status.json").write_text(json.dumps(status, indent=2) + "\n", encoding="utf-8")
          subprocess.run(["git", "add", "seo/quality-status.json"], check=True)
          if publication:
              subprocess.run(["git", "add", "seo/tool_publishing_queue.md", "articles/progress.md", *manifest.get("notes_files", [])], check=True)
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "commit", "-m", "Record passing quality check [skip ci]"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
          PY
