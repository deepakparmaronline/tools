name: Ensure Shared ToolboxKart Layout
# ToolboxKart shared-layout backfill

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ensure-shared-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Build centralized content index
        shell: bash
        run: python3 scripts/build-content-index.py

      - name: Rebuild category index pages
        shell: bash
        run: python3 scripts/build-category-indexes.py

      - name: Ensure every HTML page loads the current shared site script and AdSense account tag
        shell: python
        run: |
          from pathlib import Path
          import re

          SCRIPT_TAG = '<script src="/assets/site.js?v=20260906" defer></script>'
          SCRIPT_PATTERN = re.compile(r'<script\s+src=["\']/assets/site\.js(?:\?[^"\']*)?["\']\s+defer\s*></script>', re.I)
          ADSENSE_TAG = '<meta name="google-adsense-account" content="ca-pub-1566330144032908">'
          ADSENSE_PATTERN = re.compile(r'<meta\s+name=["\']google-adsense-account["\']\s+content=["\'][^"\']+["\']\s*/?>', re.I)
          changed = []

          for path in Path(".").rglob("index.html"):
              if any(part in {".git", "node_modules", "vendor", "_site"} for part in path.parts):
                  continue

              text = path.read_text(encoding="utf-8", errors="ignore")
              updated = SCRIPT_PATTERN.sub(SCRIPT_TAG, text)

              if SCRIPT_TAG not in updated:
                  if "</body>" in updated:
                      updated = updated.replace("</body>", f"{SCRIPT_TAG}\n</body>", 1)
                  else:
                      updated += f"\n{SCRIPT_TAG}\n"

              if ADSENSE_TAG not in updated:
                  if ADSENSE_PATTERN.search(updated):
                      updated = ADSENSE_PATTERN.sub(ADSENSE_TAG, updated, count=1)
                  elif "</head>" in updated:
                      updated = updated.replace("</head>", f"{ADSENSE_TAG}\n</head>", 1)
                  elif "<head>" in updated:
                      updated = updated.replace("<head>", f"<head>\n{ADSENSE_TAG}", 1)
                  else:
                      updated = f"{ADSENSE_TAG}\n{updated}"

              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          print("Updated:", changed if changed else "No HTML pages needed changes.")

      - name: Commit shared-layout fixes
        shell: bash
        run: |
          git config user.name "ToolboxKart Layout Bot"
          git config user.email "actions@users.noreply.github.com"
          
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git add .
          git commit -m "Add AdSense account tag to all HTML pages [ci skip]"
          git push origin main -u
