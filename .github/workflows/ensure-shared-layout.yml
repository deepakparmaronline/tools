name: Ensure Shared ToolboxKart Layout
# ToolboxKart shared-layout backfill

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ensure-shared-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Build centralized content index
        shell: bash
        run: python3 scripts/build-content-index.py

      - name: Rebuild category index pages
        shell: bash
        run: python3 scripts/build-category-indexes.py

      - name: Ensure every HTML page loads the shared site script
        shell: python
        run: |
          from pathlib import Path

          SCRIPT_TAG = '<script src="/assets/site.js" defer></script>'
          changed = []

          for path in Path(".").rglob("index.html"):
              if any(part in {".git", "node_modules", "vendor", "_site"} for part in path.parts):
                  continue

              text = path.read_text(encoding="utf-8", errors="ignore")
              if SCRIPT_TAG not in text:
                  if "</body>" in text:
                      text = text.replace("</body>", f"{SCRIPT_TAG}\n</body>", 1)
                  else:
                      text += f"\n{SCRIPT_TAG}\n"
                  path.write_text(text, encoding="utf-8")
                  changed.append(str(path))

          print("Updated:", changed if changed else "No HTML pages needed changes.")

      - name: Commit shared-layout fixes
        shell: bash
        run: |
          git config user.name "ToolboxKart Layout Bot"
          git config user.email "actions@users.noreply.github.com"
          
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git add .
          git commit -m "Apply shared ToolboxKart layout and content indexes [ci skip]"
          git push origin main -u
