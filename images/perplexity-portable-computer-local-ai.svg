<text x="150" y="310" fill="#a9a9a9" font-family="Arial,Helvetica,sans-serif" font-size="32">What “local-first” actually means for AI agents</text>
<rect x="150" y="380" width="560" height="260" rx="22" fill="#101010" stroke="#555" stroke-width="3"/>
<text x="190" y="440" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">ON DEVICE</text>
