<text x="190" y="535" fill="#ddd" font-family="Arial,Helvetica,sans-serif" font-size="24">Planner + tool router</text>
<text x="190" y="575" fill="#ddd" font-family="Arial,Helvetica,sans-serif" font-size="24">Local models</text>
<text x="190" y="615" fill="#ddd" font-family="Arial,Helvetica,sans-serif" font-size="24">Files + local search</text>
<path d="M760 510 H1020" stroke="#ffc23a" stroke-width="10" stroke-linecap="round"/>
<path d="M990 480 L1035 510 L990 540" fill="none" stroke="#ffc23a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<text x="805" y="470" fill="#ffc23a" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">USER APPROVAL</text>
<rect x="1080" y="380" width="340" height="260" rx="22" fill="#101010" stroke="#555" stroke-width="3"/>
