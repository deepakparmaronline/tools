<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Z.ai GLM-5.3 open-weight release</title>
<desc id="desc">Technical overview of the GLM-5.3 open-weight release with large parameter count, one-million-token context and large model footprint.</desc>
<rect width="1600" height="900" fill="#0d0d0d"/>
<rect x="70" y="65" width="1460" height="770" rx="30" fill="#171717" stroke="#343434" stroke-width="3"/>
<text x="120" y="145" fill="#fff" font-family="system-ui,sans-serif" font-size="50" font-weight="700">Z.AI GLM-5.3</text>
<text x="120" y="195" fill="#aaa" font-family="system-ui,sans-serif" font-size="27">Open-weight release · August 28, 2026</text>
<rect x="120" y="275" width="400" height="335" rx="22" fill="#101010" stroke="#aaa0f2" stroke-width="3"/>
<text x="160" y="345" fill="#aaa0f2" font-family="system-ui,sans-serif" font-size="28" font-weight="700">MODEL</text>
<text x="160" y="420" fill="#fff" font-family="system-ui,sans-serif" font-size="45" font-weight="700">~753B</text>
<text x="160" y="465" fill="#bbb" font-family="system-ui,sans-serif" font-size="25">parameters</text>
<text x="160" y="520" fill="#ddd" font-family="system-ui,sans-serif" font-size="24">~40B active</text>
<text x="160" y="565" fill="#888" font-family="system-ui,sans-serif" font-size="21">Mixture of Experts</text>
<rect x="600" y="275" width="400" height="335" rx="22" fill="#101010" stroke="#ffc23a" stroke-width="3"/>
<text x="640" y="345" fill="#ffc23a" font-family="system-ui,sans-serif" font-size="28" font-weight="700">CONTEXT</text>
<text x="640" y="440" fill="#fff" font-family="system-ui,sans-serif" font-size="48" font-weight="700">1M</text>
<text x="760" y="440" fill="#bbb" font-family="system-ui,sans-serif" font-size="25">tokens</text>
<text x="640" y="505" fill="#ddd" font-family="system-ui,sans-serif" font-size="24">Coding + agents</text>
<text x="640" y="555" fill="#888" font-family="system-ui,sans-serif" font-size="21">Long-horizon workloads</text>
<rect x="1080" y="275" width="400" height="335" rx="22" fill="#101010" stroke="#777" stroke-width="3"/>
<text x="1120" y="345" fill="#ddd" font-family="system-ui,sans-serif" font-size="28" font-weight="700">FOOTPRINT</text>
<text x="1120" y="440" fill="#fff" font-family="system-ui,sans-serif" font-size="48" font-weight="700">756 GB</text>
<text x="1120" y="500" fill="#ddd" font-family="system-ui,sans-serif" font-size="24">141 safetensors shards</text>
<text x="1120" y="550" fill="#888" font-family="system-ui,sans-serif" font-size="21">Serious self-hosting hardware</text>
<rect x="120" y="665" width="1360" height="70" rx="18" fill="#202020"/>
<text x="800" y="710" text-anchor="middle" fill="#ddd" font-family="system-ui,sans-serif" font-size="24">More deployment control, but much higher infrastructure requirements than a small local model</text>
</svg>