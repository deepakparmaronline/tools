<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Google AI Overviews auto-expand and SEO metrics</title><desc id="desc">Illustration of an expanded Google AI Overview above search results with SEO metrics for impressions, clicks, CTR and conversions.</desc><rect width="1600" height="900" fill="#0d0d0d"/><rect x="90" y="70" width="1420" height="760" rx="28" fill="#151515" stroke="#2a2a2a" stroke-width="3"/><text x="150" y="145" fill="#ffc23a" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">TOOL BOX KART · SEO GUIDE</text><text x="150" y="220" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="800">Google AI Overviews Auto-Expand</text><text x="150" y="270" fill="#aaa" font-family="Arial,Helvetica,sans-serif" font-size="30">What SEOs should measure after the Show more change</text><rect x="150" y="330" width="840" height="300" rx="20" fill="#101010" stroke="#444" stroke-width="3"/><rect x="185" y="365" width="770" height="105" rx="14" fill="#202020"/><text x="215" y="405" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">AI Overview</text><text x="215" y="445" fill="#bbb" font-family="Arial,Helvetica,sans-serif" font-size="20">Expanded answer appears before the traditional results</text><rect x="185" y="495" width="770" height="28" rx="8" fill="#2b2b2b"/><rect x="185" y="545" width="570" height="18" rx="7" fill="#333"/><rect x="185" y="580" width="420" height="18" rx="7" fill="#333"/><path d="M1050 385 H1420" stroke="#ffc23a" stroke-width="8" stroke-linecap="round"/><path d="M1050 470 H1350" stroke="#aaa0f2" stroke-width="8" stroke-linecap="round"/><path d="M1050 555 H1290" stroke="#67e8a5" stroke-width="8" stroke-linecap="round"/><path d="M1050 640 H1380" stroke="#8ab4f8" stroke-width="8" stroke-linecap="round"/><text x="1050" y="350" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">Measure</text><text x="1430" y="393" fill="#ffc23a" font-family="Arial,Helvetica,sans-serif" font-size="22">Impressions</text><text x="1360" y="478" fill="#aaa0f2" font-family="Arial,Helvetica,sans-serif" font-size="22">CTR</text><text x="1300" y="563" fill="#67e8a5" font-family="Arial,Helvetica,sans-serif" font-size="22">Clicks</text><text x="1390" y="648" fill="#8ab4f8" font-family="Arial,Helvetica,sans-serif" font-size="22">Conversions</text><text x="150" y="735" fill="#8f8f8f" font-family="Arial,Helvetica,sans-serif" font-size="22">The search page is becoming part of the SEO experience.</text></svg>