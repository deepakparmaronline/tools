<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found | Tool Box Kart</title>
  <meta name="description" content="The requested Tool Box Kart page could not be found.">
  <link rel="canonical" href="https://toolboxkart.tech/404.html">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #14171c; --paper: #f5f3ec; --steel: #5b6472; --yellow: #ffc23a; --border: #e1ddce; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--paper); color: var(--ink); font-family: Inter, sans-serif; }
    main { width: min(680px, 100%); border: 2px solid var(--ink); border-top: 12px solid var(--yellow); padding: clamp(32px, 7vw, 72px); background: #fff; box-shadow: 10px 10px 0 var(--ink); }
    .code { margin: 0 0 18px; color: var(--steel); font: 700 14px/1.4 'Space Mono', monospace; letter-spacing: 1px; }
    h1 { margin: 0 0 16px; font: 800 clamp(36px, 8vw, 64px)/1.05 'Space Mono', monospace; }
    p { max-width: 500px; color: var(--steel); font-size: 18px; line-height: 1.6; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
    a { display: inline-block; padding: 12px 16px; border: 2px solid var(--ink); color: var(--ink); font-weight: 700; text-decoration: none; }
    a:first-child { background: var(--yellow); }
    a:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--ink); }
  </style>
</head>
<body>
  <main>
    <p class="code">ERROR 404 / TOOL NOT FOUND</p>
    <h1>That page is off the bench.</h1>
    <p>We could not find the page you requested. Pick a section and keep building.</p>
    <nav aria-label="Main sections">
      <a href="/">Back home</a>
      <a href="/seo/">SEO tools</a>
      <a href="/finance/">Finance tools</a>
    </nav>
  </main>
</body>
</html>
